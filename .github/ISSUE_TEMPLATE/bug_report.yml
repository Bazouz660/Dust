name: Bug report
description: Report a problem with Dust
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        **Reports without a diagnostic report usually can't be investigated.** In game,
        open the Dust overlay (F11 by default) → click **Report a Bug** (bottom-left) →
        **Generate Report**, then drag the generated `DustReport_*.zip` into the
        *Diagnostic report* field below. Generate it **in a loaded save, while the
        problem is visible**: the zip records your settings, GPU and logs, so it answers
        most follow-up questions on its own.

        Before reporting, please check the
        [known issues](https://discord.com/channels/1493719918083047464/1493720366449819781)
        and the [open issues](https://github.com/Bazouz660/Dust/issues): if yours is
        already there, add your report zip to it instead of opening a new one.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
      placeholder: e.g. Shadows flicker on buildings when RTGI is enabled and the camera rotates.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      description: The Dust effect list is empty in the main menu by design - effects start once a save is loaded.
      options:
        - In a loaded save / new game
        - Only in the main menu
        - While loading a save (freeze / crash)
        - When closing the game
    validations:
      required: true
  - type: dropdown
    id: effects-off
    attributes:
      label: Does it still happen with "Toggle Effects" turned off in the F11 menu?
      options:
        - "No - it goes away with effects off"
        - "Yes - it still happens with effects off"
        - I did not test
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. Load a save near The Hub at night
        2. Enable RTGI with the dust_high preset
        3. Rotate the camera
    validations:
      required: false
  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: Drag & drop the DustReport_*.zip generated by the in-game Report-a-Bug button here (if the game crashes before you can open the menu, attach the DustCrash_*.zip or the Dust_*.log files from the mod's logs folder instead). Screenshots or a short video of the issue are also very welcome.
    validations:
      required: true
  - type: textarea
    id: sysinfo
    attributes:
      label: System summary
      description: Auto-filled when you open this form from the in-game button. Otherwise, paste the summary from the Copy Summary button or describe your system (GPU, driver, OS, Linux/Proton version if any, Dust version, preset).
    validations:
      required: false
  - type: checkboxes
    id: followup
    attributes:
      label: Follow-up
      options:
        - label: I will check back on this issue - reports with unanswered questions are closed after 3 weeks (you can always reopen).
          required: true
