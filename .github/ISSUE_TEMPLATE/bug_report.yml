name: Bug report
description: Report a problem with Dust
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        **The fastest way to give me everything I need:** in game, open the Dust
        overlay (F11 by default) → click **Report a Bug** (bottom-left) →
        **Generate Report**, then drag the generated `DustReport_*.zip` into the
        *Diagnostic report* field below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
      placeholder: e.g. Shadows flicker on buildings when RTGI is enabled and the camera rotates.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. Load a save near The Hub at night
        2. Enable RTGI with the dust_high preset
        3. Rotate the camera
    validations:
      required: false
  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: Drag & drop the DustReport_*.zip generated by the in-game Report-a-Bug button here. Screenshots or video of the issue are also very welcome.
    validations:
      required: false
  - type: textarea
    id: sysinfo
    attributes:
      label: System summary
      description: Auto-filled when you open this form from the in-game button. Otherwise, paste the summary from the Copy Summary button or describe your system (GPU, driver, OS, Dust version, preset).
    validations:
      required: false
