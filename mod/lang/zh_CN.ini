Toggle Effects=全局效果开关
Toggle Effects: (unbound)=全局效果开关：（未绑定）
Toggle Effects: %s=全局效果开关：%s
Click to rebind the overlay toggle key=点击重新绑定覆盖层开关键
tip:Toggle Effects hotkey=点击重新绑定全局效果开关热键。无论菜单是否打开都生效。要取消绑定，可在 Dust.ini 中设置 ToggleEffectsKey=0。
tip:Show Motion Vectors=显示运动矢量调试叠加层：灰色表示静止，彩色表示运动方向和强度，红色表示没有有效运动矢量。移动时观察草丛和植被；如果它们摆动时仍是灰色，就没有可用的运动矢量，DLAA 下会出现重影。
tip:Upscaling=时间抗锯齿 / 超分辨率。DLAA 仅支持 NVIDIA RTX（画质最佳）；FSR2 支持任意 GPU（原生 D3D11）；FSR3 / FSR4 通过 D3D12 侧设备支持任意 DX12 GPU，其中 FSR4 需要 Radeon RX 9000；禁用则关闭。
DLAA unavailable (needs NVIDIA RTX + recent driver)=DLAA 不可用（需要 NVIDIA RTX 和较新的驱动）
tip:DLAA model=DLAA 模型。F = CNN（推荐）。K/J 是 DLSS 4 Transformer，理论上最锐利，但当前集成中静态画面可能整体发糊。更改后将在下一帧重建功能。
Sharpness=锐化
tip:Sharpness=对超分输出应用受限对比度锐化（RCAS），在不增加类似 Clarity 的对比度增强和光晕的情况下增强细节。数值过高可能重新引入锯齿。
Show Motion Vectors=显示运动矢量
Restart the game to enable motion vectors=重启游戏以启用运动矢量
tip:Restart for motion vectors=运动矢量输出是在 Kenshi 启动时编译进游戏着色器的。本次启动时超分辨率处于关闭状态，因此着色器没有速度输出：在重启游戏之前，移动的物体会出现重影。设置已保存；下次启动会以运动矢量编译着色器。
Motion Vectors=运动矢量
