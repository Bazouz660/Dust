# Effect setting descriptions.
desc:Bloom:Enabled=启用或禁用泛光效果。
desc:Bloom:Intensity=整体泛光亮度倍率。
desc:Bloom:Threshold=像素参与泛光所需的最低亮度。
desc:Bloom:Soft Knee=阈值截断的平滑度（0 为硬阈值，1 为柔和阈值）。
desc:Bloom:Radius=泛光模糊核大小。
desc:Bloom:Curve=控制泛光从亮区向外衰减的曲线。
desc:Bloom:Scatter=泛光在 mip 层级间扩散的距离（越高光晕越宽）。
desc:Bloom:Glow Amount=更深 mip 层的额外扩散，用于增强亮物体周围可见光晕。
desc:Bloom:Mip Levels=模糊 passes 数量（越多泛光越宽，开销越高）。
desc:Bloom:Debug View=显示合成前的原始泛光贡献。

desc:Clarity:Enabled=启用或禁用清晰度效果。
desc:Clarity:Strength=局部对比度增强强度。
desc:Clarity:Midtone Protect=保护中间调，避免过度锐化（0 为不保护）。
desc:Clarity:Blur Radius=细节提取模糊半径。
desc:Clarity:Debug View=显示提取出的细节层。

desc:Chromatic Aberration:Enabled=启用或禁用色差效果。
desc:Chromatic Aberration:Strength=屏幕边缘 RGB 色边强度。
desc:Chromatic Aberration:Debug View=以热力图显示偏移幅度。

desc:Deband:Enabled=启用或禁用去色带。
desc:Deband:Threshold=被视为色带的最大颜色差异。
desc:Deband:Range=用于平均采样的像素搜索半径。
desc:Deband:Intensity=去色带结果的混合强度。
desc:Deband:Sky Only=只对天空像素应用去色带。
desc:Deband:Sky Threshold=高于该深度值的像素会被视为天空。
desc:Deband:Debug View=高亮显示受去色带影响的区域。

desc:Depth of Field:Enabled=启用或禁用景深。
desc:Depth of Field:Auto Focus=自动对焦到屏幕中心物体。
desc:Depth of Field:Focus Speed=自动对焦适应新目标的速度。
desc:Depth of Field:Focus Distance=手动对焦距离（关闭自动对焦时使用）。
desc:Depth of Field:Near Start=焦点前方开始出现近景模糊的距离。
desc:Depth of Field:Near End=焦点前方近景模糊达到最大值的距离。
desc:Depth of Field:Near Strength=近景最大模糊强度（0 表示无近景模糊）。
desc:Depth of Field:Far Start=焦点后方开始出现远景模糊的距离。
desc:Depth of Field:Far End=焦点后方远景模糊达到最大值的距离。
desc:Depth of Field:Far Strength=远景最大模糊强度（0 表示无远景模糊）。
desc:Depth of Field:Blur Radius=模糊核像素大小。
desc:Depth of Field:Blur Downscale=模糊 pass 的分辨率除数（2 为半分辨率，4 为四分之一）。
desc:Depth of Field:Blur Shape=离焦区域的模糊核形状。
desc:Depth of Field:Max Depth=处理的最大深度（跳过远处物体和天空）。
desc:Depth of Field:Physical DoF=使用薄透镜光圈模型，而不是手动近/远模糊坡度。
desc:Depth of Field:Aperture=物理景深的镜头光圈大小（越小焦深越深）。
desc:Depth of Field:Highlight Threshold=高于该亮度的高光会穿透模糊。
desc:Depth of Field:Highlight Boost=模糊区域中高光穿透的强度。
desc:Depth of Field:Debug View=以彩色叠加可视化弥散圆。

desc:Film Grain:Enabled=启用或禁用胶片颗粒。
desc:Film Grain:Intensity=颗粒噪声强度。
desc:Film Grain:Size=颗粒像素大小。
desc:Film Grain:Colored=使用彩色噪声，而不是只使用亮度噪声。
desc:Film Grain:Debug View=显示原始噪声图案。

desc:Kuwahara:Enabled=启用或禁用 Kuwahara 油画滤镜。
desc:Kuwahara:Radius=滤波核半径（越大风格化越明显）。
desc:Kuwahara:Strength=原始图像与滤波图像之间的混合比例。
desc:Kuwahara:Sharpness=边缘保留锐度（越高边界越清晰）。
desc:Kuwahara:Debug View=不混合原图，直接显示滤波结果。

desc:Letterbox:Enabled=启用或禁用电影遮幅。
desc:Letterbox:Aspect Ratio=目标宽高比（当目标比屏幕更宽时出现黑边）。
desc:Letterbox:Opacity=遮幅不透明度（0 为透明，1 为实色）。
desc:Letterbox:Bar Red=遮幅颜色的红色分量。
desc:Letterbox:Bar Green=遮幅颜色的绿色分量。
desc:Letterbox:Bar Blue=遮幅颜色的蓝色分量。
desc:Letterbox:Debug View=高亮显示遮幅区域。

desc:LUT:Enabled=启用或禁用色彩分级。
desc:LUT:Tonemapper=HDR 到 LDR 的色调映射算子。
desc:LUT:Exposure=整体曝光调整，单位为 EV 档。
desc:LUT:Auto Exposure=根据场景亮度自动调整曝光。
desc:LUT:Adaptation Speed=自动曝光适应亮度变化的速度。
desc:LUT:Min Auto EV=自动曝光的最低曝光值。
desc:LUT:Max Auto EV=自动曝光的最高曝光值。
desc:LUT:Intensity=色彩分级 LUT 的混合因子（0 为旁路）。
desc:LUT:Lift (Shadows)=应用到暗部色调的亮度偏移。
desc:LUT:Gamma (Midtones)=中间调伽马曲线调整。
desc:LUT:Gain (Highlights)=高光亮度倍率。
desc:LUT:Contrast=整体对比度调整。
desc:LUT:Saturation=色彩饱和度倍率（0 为灰度）。
desc:LUT:Temperature=白平衡偏移（负值更冷，正值更暖）。
desc:LUT:Tint=绿色-洋红色调偏移。
desc:LUT:Shadow Red=阴影区域红色色调。
desc:LUT:Shadow Green=阴影区域绿色色调。
desc:LUT:Shadow Blue=阴影区域蓝色色调。
desc:LUT:Highlight Red=高光区域红色色调。
desc:LUT:Highlight Green=高光区域绿色色调。
desc:LUT:Highlight Blue=高光区域蓝色色调。

desc:Outline:Enabled=启用或禁用边缘描边。
desc:Outline:Depth Threshold=绘制描边所需的最小深度差。
desc:Outline:Normal Threshold=绘制描边所需的最小法线差。
desc:Outline:Thickness=描边宽度（像素）。
desc:Outline:Strength=描边不透明度（0 为不可见，1 为完全不透明）。
desc:Outline:Color R=描边颜色的红色分量。
desc:Outline:Color G=描边颜色的绿色分量。
desc:Outline:Color B=描边颜色的蓝色分量。
desc:Outline:Max Depth=绘制描边的最大深度（跳过远处物体）。
desc:Outline:Debug View=显示原始边缘检测结果。

desc:RTGI:Enabled=启用或禁用光线追踪全局光照。
desc:RTGI:GI Intensity=间接光反弹亮度。
desc:RTGI:AO Intensity=环境光遮蔽变暗强度。
desc:RTGI:Shadow Contrast=方向性 GI 遮蔽的对比度。大于 1 会加深缝隙/物体下方阴影；1.0 为普通线性 AO。
desc:RTGI:Ray Length=GI 收集半径（屏幕空间 horizon marching 距离）。
desc:RTGI:Steps Per Slice=每个 horizon 切片的深度采样数（越多质量越高，开销越高）。
desc:RTGI:Slices=每像素 horizon 切片方向数量（越多噪点越少，开销越高）。
desc:RTGI:Thickness=可见表面背后的假定遮挡物厚度。
desc:RTGI:Thickness Curve=厚度随距离缩放的方式。
desc:RTGI:Fade Distance=效果淡出的距离。
desc:RTGI:Normal Detail=法线贴图影响（0 为平滑几何，1 为完整细节）。
desc:RTGI:Bounce Intensity=二次光反弹强度。
desc:RTGI:Saturation=间接光颜色饱和度。
desc:RTGI:Denoise Steps=空间降噪 passes 数量。
desc:RTGI:Depth Sigma=降噪器的深度敏感度。
desc:RTGI:Color Phi=降噪器的颜色敏感度。
desc:RTGI:Resolution %=以原生分辨率百分比渲染（越低越快）。
desc:RTGI:Debug View=调试可视化模式（0 为关闭）。

desc:SMAA:Enabled=启用或禁用抗锯齿。
desc:SMAA:Mode=边缘检测方式：亮度、深度或二者同时。
desc:SMAA:Luma Threshold=基于亮度的边缘检测敏感度（越低检测到更多边缘）。
desc:SMAA:Depth Threshold=基于深度的边缘检测敏感度（越低检测到更多边缘）。
desc:SMAA:Show Edges=可视化检测到的边缘。
desc:SMAA:Show Weights=可视化混合权重。

desc:SSAO:Enabled=启用或禁用环境光遮蔽。
desc:SSAO:Radius=用于遮蔽测试的世界空间采样半径。
desc:SSAO:Strength=遮蔽变暗强度。
desc:SSAO:Bias=防止自遮蔽伪影的偏移。
desc:SSAO:Max Depth=应用遮蔽的最大深度。
desc:SSAO:Filter Radius=平滑 AO 结果的模糊半径。
desc:SSAO:Foreground Fade=非常近的物体上效果淡出的速度。
desc:SSAO:Falloff Power=遮蔽随采样距离衰减的速度。
desc:SSAO:Max Screen Radius=屏幕空间最大采样半径。
desc:SSAO:Min Screen Radius=屏幕空间最小采样半径。
desc:SSAO:Blur Sharpness=边缘感知模糊锐度（越高保留更多细节）。
desc:SSAO:Normal Detail=法线贴图影响（0 为平滑几何，1 为完整细节）。
desc:SSAO:Direct Light AO=AO 影响直射光区域的程度。
desc:SSAO:Samples=每像素采样方向数量。
desc:SSAO:Steps=每个方向的采样数量。
desc:SSAO:Debug View=显示合成前的原始环境光遮蔽。

desc:SSIL:Enabled=启用或禁用屏幕空间间接光。
desc:SSIL:Radius=间接光采样半径。
desc:SSIL:Strength=间接光贡献强度。
desc:SSIL:Bias=防止自发光伪影的偏移。
desc:SSIL:Max Depth=应用效果的最大深度。
desc:SSIL:Foreground Fade=非常近的物体上效果淡出的速度。
desc:SSIL:Falloff Power=光照贡献随距离衰减的速度。
desc:SSIL:Max Screen Radius=屏幕空间最大采样半径。
desc:SSIL:Min Screen Radius=屏幕空间最小采样半径。
desc:SSIL:Color Bleeding=附近表面颜色渗到相邻表面的程度。
desc:SSIL:Directions=每像素采样方向数量。
desc:SSIL:Steps=每个方向的采样数量。
desc:SSIL:Blur Sharpness=边缘感知模糊锐度（越高保留更多细节）。
desc:SSIL:Debug View=显示合成前的原始间接光。

# Vignette common settings.
desc:Vignette:Enabled=启用或禁用暗角效果。
desc:Vignette:Intensity=暗角强度。
desc:Vignette:Radius=暗角半径。
desc:Vignette:Softness=暗角边缘柔和度。
desc:Vignette:Roundness=暗角形状圆度。
desc:Vignette:Center X=暗角中心 X 坐标。
desc:Vignette:Center Y=暗角中心 Y 坐标。
desc:Vignette:Debug View=显示暗角调试视图。
Softness=柔和度
Roundness=圆度
Center X=中心 X
Center Y=中心 Y
