# Stable description keys. These avoid using full English sentences that contain '='.
desc:Shadows:Enabled=启用或禁用 Dust 改进阴影滤波（RTWSM 和 CSM）。关闭时使用 Kenshi 原版滤波。
desc:Shadows:Shadow Resolution=覆盖阴影贴图集分辨率。原版表示不覆盖（零额外开销）。数值越高阴影越清晰，但阴影渲染会成比例增加 GPU 时间和显存占用（16384 约 1 GB）；8192 以上可能明显影响帧率。下一帧生效。
desc:Shadows:Shadow Range=阴影最大渲染距离。绕过游戏设置界面 9000 的上限。实时生效（下一帧重新计算级联分割和阴影相机），并写入 settings.cfg 以便重启后保留。若在游戏内调整阴影距离滑块，会覆盖这里的值。
desc:Shadows:Filter Radius=阴影柔化滤波半径（仅 RTWSM）。
desc:Shadows:Light Size=接触硬化阴影的模拟光源大小（RTWSM PCSS）。
desc:Shadows:PCSS=启用 RTWSM 的 PCSS 百分比渐近软阴影（基于距离的柔和度）。
desc:Shadows:Cliff Shadow Fix=减少陡峭悬崖和垂直表面的阴影痤疮（仅 RTWSM）。可能让近距离垂直阴影淡出。集成自 Crunk Aint Dead 的 Cliff Face Shadow Fix mod。
desc:Shadows:Cliff Fix Distance=悬崖修复平滑介入的范围，占阴影距离的比例；数值越高，越能保留近距离垂直阴影。
desc:Shadows:Cascade Lambda=PSSM 级联分割分布。0.95（默认）保留 Kenshi 原生分割；其他值会覆盖：0.0 为纯线性（近处阴影覆盖更远但更块状），1.0 为纯对数（近处阴影小而锐，远处级联更大）。
desc:Shadows:CSM Filter Radius=CSM PCF 滤波半径的全局倍率，叠加在 Kenshi 原版每级联渐变半径之上。
desc:Shadows:Cascade Blending=在相邻 CSM 级联的分割边界附近平滑混合，隐藏级联交界处的硬分辨率跳变。
desc:Shadows:Cascade Blend Width=每个级联边界混合带的宽度，以级联深度范围比例表示（0.05 较轻微，0.25 较宽）。
desc:Shadows:CSM Far Softness=仅控制最远一级级联的柔和度，不影响近/中级联。较低更清晰，较高更柔和。
