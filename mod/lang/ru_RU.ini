desc:Shadows:Enabled=Включает или выключает улучшенную фильтрацию теней Dust (RTWSM и CSM). При выключении Kenshi использует свою исходную фильтрацию.
desc:Shadows:Shadow Resolution=Переопределяет разрешение атласа теней. Ванильное = без переопределения (нулевая стоимость). Чем выше значение, тем резче тени, но время GPU и видеопамять рендеринга теней растут пропорционально (16384 ≈ 1 ГБ); выше 8192 частота кадров может заметно упасть. Применяется на следующем кадре.
desc:Shadows:Shadow Range=Максимальная дистанция отрисовки теней. Обходит ограничение 9000 в меню настроек игры. Применяется сразу (разбиение каскадов и теневая камера пересчитываются на следующем кадре) и записывается в settings.cfg, чтобы сохраниться после перезапуска. Перемещение ползунка дальности теней в игре перезаписывает это значение.
desc:Shadows:Filter Radius=Радиус фильтра смягчения теней (только RTWSM).
desc:Shadows:Light Size=Размер имитируемого источника света для контактно-затвердевающих теней (PCSS RTWSM).
desc:Shadows:PCSS=Включает мягкие тени PCSS (Percentage-Closer Soft Shadows) для RTWSM (мягкость зависит от расстояния).
desc:Shadows:Cliff Shadow Fix=Уменьшает теневое «акне» на крутых скалах и вертикальных поверхностях (только RTWSM). Может ослаблять близкие вертикальные тени. Интегрировано из мода Cliff Face Shadow Fix от Crunk Aint Dead.
desc:Shadows:Cliff Fix Distance=Диапазон, на котором плавно включается исправление скал, как доля дальности теней; выше = сохраняется больше близких вертикальных теней.
desc:Shadows:Cascade Lambda=Распределение разбиения каскадов PSSM. 0,95 (по умолчанию) сохраняет родное разбиение Kenshi; любое другое значение переопределяет его: 0,0 = чисто линейное (ближние тени покрывают дальше, но более блочные), 1,0 = чисто логарифмическое (ближние тени маленькие и резкие, дальние каскады крупнее).
desc:Shadows:CSM Filter Radius=Глобальный множитель радиуса PCF-фильтра CSM поверх исходного ступенчатого радиуса Kenshi для каждого каскада.
desc:Shadows:Cascade Blending=Плавно смешивает соседние каскады CSM около границ разбиения, скрывая резкий скачок разрешения на стыках.
desc:Shadows:Cascade Blend Width=Ширина зоны смешивания на каждой границе каскада, как доля глубины каскада (0,05 = едва заметно, 0,25 = широко).
desc:Shadows:CSM Far Softness=Управляет только мягкостью самого дальнего каскада, не затрагивая ближние/средние. Ниже = резче, выше = мягче.

