desc:Bloom:Enabled=Включает или выключает эффект bloom.
desc:Bloom:Intensity=Общий множитель яркости bloom.
desc:Bloom:Threshold=Минимальная яркость, при которой пиксель участвует в bloom.
desc:Bloom:Soft Knee=Мягкость среза порога (0 = жёсткий порог, 1 = мягкий порог).
desc:Bloom:Radius=Размер ядра размытия bloom.
desc:Bloom:Curve=Управляет кривой спада bloom вокруг ярких областей.
desc:Bloom:Scatter=Насколько далеко bloom рассеивается между уровнями мип (выше = шире свечение).
desc:Bloom:Glow Amount=Дополнительное рассеивание глубоких мипов для более заметного свечения вокруг ярких объектов.
desc:Bloom:Mip Levels=Количество проходов размытия (больше = шире bloom, дороже).
desc:Bloom:Debug View=Показывает сырой вклад bloom до композитинга.

desc:Clarity:Enabled=Включает или выключает эффект чёткости.
desc:Clarity:Strength=Сила усиления локального контраста.
desc:Clarity:Midtone Protect=Защищает средние тона от избыточной резкости (0 = без защиты).
desc:Clarity:Blur Radius=Радиус размытия для извлечения деталей.
desc:Clarity:Debug View=Показывает извлечённый слой деталей.

desc:Chromatic Aberration:Enabled=Включает или выключает хроматическую аберрацию.
desc:Chromatic Aberration:Strength=Сила RGB-каймы у краёв экрана.
desc:Chromatic Aberration:Debug View=Показывает величину смещения в виде тепловой карты.

desc:Deband:Enabled=Включает или выключает deband.
desc:Deband:Threshold=Максимальная разница цветов, считающаяся бандингом.
desc:Deband:Range=Радиус поиска в пикселях для усредняющей выборки.
desc:Deband:Intensity=Сила смешивания результата deband.
desc:Deband:Sky Only=Применять deband только к пикселям неба.
desc:Deband:Sky Threshold=Пиксели за этим значением глубины считаются небом.
desc:Deband:Debug View=Подсвечивает области, затронутые deband.

desc:Depth of Field:Enabled=Включает или выключает глубину резкости.
desc:Depth of Field:Auto Focus=Автоматически фокусируется на объекте в центре экрана.
desc:Depth of Field:Focus Speed=Скорость, с которой автофокус подстраивается под новую цель.
desc:Depth of Field:Focus Distance=Ручная дистанция фокуса (используется при выключенном автофокусе).
desc:Depth of Field:Near Start=Расстояние перед точкой фокуса, где начинается ближнее размытие.
desc:Depth of Field:Near End=Расстояние перед точкой фокуса, где ближнее размытие достигает максимума.
desc:Depth of Field:Near Strength=Максимальная сила ближнего размытия (0 = без ближнего размытия).
desc:Depth of Field:Far Start=Расстояние за точкой фокуса, где начинается дальнее размытие.
desc:Depth of Field:Far End=Расстояние за точкой фокуса, где дальнее размытие достигает максимума.
desc:Depth of Field:Far Strength=Максимальная сила дальнего размытия (0 = без дальнего размытия).
desc:Depth of Field:Blur Radius=Размер ядра размытия в пикселях.
desc:Depth of Field:Blur Downscale=Делитель разрешения прохода размытия (2 = половина, 4 = четверть).
desc:Depth of Field:Blur Shape=Форма ядра размытия в областях вне фокуса.
desc:Depth of Field:Max Depth=Максимальная обрабатываемая глубина (пропускает дальние объекты и небо).
desc:Depth of Field:Physical DoF=Использует модель диафрагмы тонкой линзы вместо ручных кривых ближнего/дальнего размытия.
desc:Depth of Field:Aperture=Размер диафрагмы объектива для физической глубины резкости (меньше = больше глубина резкости).
desc:Depth of Field:Highlight Threshold=Блики ярче этого значения проступают сквозь размытие.
desc:Depth of Field:Highlight Boost=Насколько сильно блики проступают сквозь размытые области.
desc:Depth of Field:Debug View=Визуализирует круг нерезкости цветным наложением.

desc:Film Grain:Enabled=Включает или выключает зернистость плёнки.
desc:Film Grain:Intensity=Сила шума зерна.
desc:Film Grain:Size=Размер зерна в пикселях.
desc:Film Grain:Colored=Использовать цветной шум вместо только яркостного.
desc:Film Grain:Debug View=Показывает сырой шумовой узор.

desc:Kuwahara:Enabled=Включает или выключает живописный фильтр Кувахары.
desc:Kuwahara:Radius=Радиус ядра фильтра (больше = сильнее стилизация).
desc:Kuwahara:Strength=Доля смешивания исходного и отфильтрованного изображения.
desc:Kuwahara:Sharpness=Резкость сохранения краёв (выше = чётче границы).
desc:Kuwahara:Debug View=Показывает отфильтрованный результат без смешивания с оригиналом.

desc:Letterbox:Enabled=Включает или выключает кинематографические чёрные полосы.
desc:Letterbox:Aspect Ratio=Целевое соотношение сторон (полосы появляются, когда оно шире экрана).
desc:Letterbox:Opacity=Непрозрачность полос (0 = прозрачные, 1 = сплошные).
desc:Letterbox:Bar Red=Красная составляющая цвета полос.
desc:Letterbox:Bar Green=Зелёная составляющая цвета полос.
desc:Letterbox:Bar Blue=Синяя составляющая цвета полос.
desc:Letterbox:Debug View=Подсвечивает область полос.

desc:LUT:Enabled=Включает или выключает цветокоррекцию.
desc:LUT:Tonemapper=Оператор тонального отображения HDR в LDR.
desc:LUT:Exposure=Общая коррекция экспозиции в ступенях EV.
desc:LUT:Auto Exposure=Автоматически подстраивает экспозицию под яркость сцены.
desc:LUT:Adaptation Speed=Скорость адаптации автоэкспозиции к изменениям яркости.
desc:LUT:Min Auto EV=Минимальное значение экспозиции для автоэкспозиции.
desc:LUT:Max Auto EV=Максимальное значение экспозиции для автоэкспозиции.
desc:LUT:Intensity=Коэффициент смешивания LUT цветокоррекции (0 = обход).
desc:LUT:Lift (Shadows)=Смещение яркости, применяемое к тёмным тонам.
desc:LUT:Gamma (Midtones)=Коррекция гамма-кривой средних тонов.
desc:LUT:Gain (Highlights)=Множитель яркости светов.
desc:LUT:Contrast=Общая коррекция контраста.
desc:LUT:Saturation=Множитель насыщенности цвета (0 = оттенки серого).
desc:LUT:Temperature=Сдвиг баланса белого (отрицательный = холоднее, положительный = теплее).
desc:LUT:Tint=Сдвиг оттенка зелёный–пурпурный.
desc:LUT:Shadow Red=Красный оттенок в тенях.
desc:LUT:Shadow Green=Зелёный оттенок в тенях.
desc:LUT:Shadow Blue=Синий оттенок в тенях.
desc:LUT:Highlight Red=Красный оттенок в светах.
desc:LUT:Highlight Green=Зелёный оттенок в светах.
desc:LUT:Highlight Blue=Синий оттенок в светах.

desc:Outline:Enabled=Включает или выключает контуры.
desc:Outline:Depth Threshold=Минимальная разница глубины для рисования контура.
desc:Outline:Normal Threshold=Минимальная разница нормалей для рисования контура.
desc:Outline:Thickness=Толщина контура в пикселях.
desc:Outline:Strength=Непрозрачность контура (0 = невидим, 1 = полностью непрозрачен).
desc:Outline:Color R=Красная составляющая цвета контура.
desc:Outline:Color G=Зелёная составляющая цвета контура.
desc:Outline:Color B=Синяя составляющая цвета контура.
desc:Outline:Max Depth=Максимальная глубина рисования контуров (пропускает дальние объекты).
desc:Outline:Debug View=Показывает сырой результат обнаружения краёв.

desc:RTGI:Enabled=Включает или выключает трассированное глобальное освещение.
desc:RTGI:GI Intensity=Яркость отскока непрямого света.
desc:RTGI:AO Intensity=Сила затемнения от ambient occlusion.
desc:RTGI:Shadow Contrast=Контраст направленного затенения GI. Выше 1 затемняет щели и низ объектов; 1,0 = обычное линейное AO.
desc:RTGI:Ray Length=Радиус сбора GI (дистанция horizon marching в экранном пространстве).
desc:RTGI:Steps Per Slice=Выборок глубины на срез горизонта (больше = лучше качество, дороже).
desc:RTGI:Slices=Количество направлений срезов горизонта на пиксель (больше = меньше шума, дороже).
desc:RTGI:Thickness=Предполагаемая толщина заслоняющих объектов за видимыми поверхностями.
desc:RTGI:Thickness Curve=Как толщина масштабируется с расстоянием.
desc:RTGI:Fade Distance=Расстояние, на котором эффект затухает.
desc:RTGI:Normal Detail=Влияние карты нормалей (0 = гладкая геометрия, 1 = полная детализация).
desc:RTGI:Bounce Intensity=Сила вторичного отскока света.
desc:RTGI:Saturation=Насыщенность цвета непрямого света.
desc:RTGI:Denoise Steps=Количество проходов пространственного шумоподавления.
desc:RTGI:Depth Sigma=Чувствительность шумоподавителя к глубине.
desc:RTGI:Color Phi=Чувствительность шумоподавителя к цвету.
desc:RTGI:Resolution %=Рендер в процентах от родного разрешения (ниже = быстрее).
desc:RTGI:Debug View=Режим отладочной визуализации (0 = выкл).

desc:SMAA:Enabled=Включает или выключает сглаживание.
desc:SMAA:Mode=Метод обнаружения краёв: яркость, глубина или оба.
desc:SMAA:Luma Threshold=Чувствительность обнаружения краёв по яркости (ниже = больше краёв).
desc:SMAA:Depth Threshold=Чувствительность обнаружения краёв по глубине (ниже = больше краёв).
desc:SMAA:Show Edges=Визуализирует обнаруженные края.
desc:SMAA:Show Weights=Визуализирует веса смешивания.

desc:SSAO:Enabled=Включает или выключает ambient occlusion.
desc:SSAO:Radius=Радиус выборки в мировом пространстве для теста затенения.
desc:SSAO:Strength=Сила затемнения от затенения.
desc:SSAO:Bias=Смещение для предотвращения артефактов самозатенения.
desc:SSAO:Max Depth=Максимальная глубина применения затенения.
desc:SSAO:Filter Radius=Радиус размытия для сглаживания результата AO.
desc:SSAO:Foreground Fade=Скорость затухания эффекта на очень близких объектах.
desc:SSAO:Falloff Power=Скорость спада затенения с расстоянием выборки.
desc:SSAO:Max Screen Radius=Максимальный радиус выборки в экранном пространстве.
desc:SSAO:Min Screen Radius=Минимальный радиус выборки в экранном пространстве.
desc:SSAO:Blur Sharpness=Резкость размытия с учётом краёв (выше = сохраняется больше деталей).
desc:SSAO:Normal Detail=Влияние карты нормалей (0 = гладкая геометрия, 1 = полная детализация).
desc:SSAO:Direct Light AO=Насколько AO влияет на области под прямым светом.
desc:SSAO:Samples=Количество направлений выборки на пиксель.
desc:SSAO:Steps=Количество выборок на направление.
desc:SSAO:Debug View=Показывает сырое ambient occlusion до композитинга.

desc:SSIL:Enabled=Включает или выключает непрямое освещение в экранном пространстве.
desc:SSIL:Radius=Радиус выборки непрямого света.
desc:SSIL:Strength=Сила вклада непрямого света.
desc:SSIL:Bias=Смещение для предотвращения артефактов самоосвещения.
desc:SSIL:Max Depth=Максимальная глубина применения эффекта.
desc:SSIL:Foreground Fade=Скорость затухания эффекта на очень близких объектах.
desc:SSIL:Falloff Power=Скорость спада вклада света с расстоянием.
desc:SSIL:Max Screen Radius=Максимальный радиус выборки в экранном пространстве.
desc:SSIL:Min Screen Radius=Минимальный радиус выборки в экранном пространстве.
desc:SSIL:Color Bleeding=Насколько цвет соседних поверхностей переносится на прилегающие поверхности.
desc:SSIL:Directions=Количество направлений выборки на пиксель.
desc:SSIL:Steps=Количество выборок на направление.
desc:SSIL:Blur Sharpness=Резкость размытия с учётом краёв (выше = сохраняется больше деталей).
desc:SSIL:Debug View=Показывает сырой непрямой свет до композитинга.

desc:Vignette:Enabled=Включает или выключает эффект виньетки.
desc:Vignette:Intensity=Сила виньетки.
desc:Vignette:Radius=Радиус виньетки.
desc:Vignette:Softness=Мягкость края виньетки.
desc:Vignette:Roundness=Округлость формы виньетки.
desc:Vignette:Center X=Координата X центра виньетки.
desc:Vignette:Center Y=Координата Y центра виньетки.
desc:Vignette:Debug View=Показывает отладочный вид виньетки.
desc:Vignette:Shape=Стиль формы виньетки.
Softness=Мягкость
Roundness=Округлость
Center X=Центр X
Center Y=Центр Y
Dust Settings=Настройки Dust
Shape=Форма
Vignette shape=Форма виньетки
Debug View=Отладочный вид
How much the edges darken=Насколько затемняются края.
Distance from center where darkening begins=Расстояние от центра, с которого начинается затемнение.
Show the vignette mask=Показывает маску виньетки.
Stretch the vignette horizontally (>1) or vertically (<1)=Растягивает виньетку по горизонтали (>1) или по вертикали (<1).
Write timestamped logs to the logs/ folder next to the DLL. Only the 10 newest sessions are kept (20 MB max each), so disk usage stays bounded. Needed for useful bug reports.=Записывает журналы с отметками времени в папку logs/ рядом с DLL. Хранятся только 10 последних сессий (не более 20 МБ каждая), поэтому объём на диске ограничен. Нужно для полезных отчётов об ошибках.
Dust logs, framework config and live effect settings=Журналы Dust, конфигурация фреймворка и текущие настройки эффектов
Active preset files=Файлы активного пресета
Kenshi graphics settings and mod load order=Графические настройки Kenshi и порядок загрузки модов
Hardware info (GPU, driver, monitors, CPU, RAM, OS)=Сведения об оборудовании (GPU, драйвер, мониторы, CPU, ОЗУ, ОС)
Detected overlays (ReShade, RTSS, ...) and RE_Kenshi info=Обнаруженные оверлеи (ReShade, RTSS, ...) и сведения о RE_Kenshi
