Click to rebind the overlay toggle key=Нажмите, чтобы переназначить клавишу открытия меню
tip:Toggle Effects hotkey=Нажмите, чтобы переназначить горячую клавишу включения/выключения всех эффектов. Работает независимо от того, открыто ли меню. Чтобы снять назначение, укажите ToggleEffectsKey=0 в Dust.ini.
tip:Show Motion Vectors=Отладочное наложение буфера векторов движения: серый = неподвижно, цвет = направление/величина движения, красный = вектора нет. Наблюдайте за травой и растительностью при движении; если они остаются серыми, покачиваясь, у них нет корректного вектора движения и под DLAA появятся шлейфы.
tip:Upscaling=Временное сглаживание / апскейлинг. DLAA = только NVIDIA RTX (лучшее качество). FSR2 = любая видеокарта (нативный D3D11). FSR3 / FSR4 = любая видеокарта с DX12 через вспомогательное устройство D3D12; для FSR4 нужна Radeon RX 9000. Отключено = выкл.
DLAA unavailable (needs NVIDIA RTX + recent driver)=DLAA недоступен (нужна NVIDIA RTX и свежий драйвер)
tip:DLAA model=Модель DLAA. F = CNN (рекомендуется). K/J — трансформер DLSS 4: в теории самые резкие, но в этой интеграции размывают всё изображение, когда сцена статична. Изменение пересоздаёт функцию на следующем кадре.
Sharpness=Резкость
tip:Sharpness=Повышение резкости с ограничением контраста (RCAS) на выходе апскейлера: добавляет детали без усиления контраста/ореолов, как у Чёткости. Высокие значения могут вернуть лесенки.
Show Motion Vectors=Показать векторы движения
Restart the game to enable motion vectors=Перезапустите игру, чтобы включить векторы движения
tip:Restart for motion vectors=Вывод векторов движения компилируется в шейдеры игры при запуске Kenshi. Эта сессия началась с выключенным апскейлингом, поэтому у шейдеров нет вывода скорости: движущиеся объекты будут оставлять шлейфы до перезапуска игры. Настройка сохранена; при следующем запуске шейдеры будут скомпилированы с векторами движения.
Motion Vectors=Векторы движения
UI theme. Kenshi: desaturated grey-tan palette matching the game. Dark: ImGui default.=Тема интерфейса. Kenshi: приглушённая серо-бежевая палитра в стиле игры. Тёмная: стандартная тема ImGui.
