desc:Shadows:Enabled=Activa o desactiva el filtrado de sombras mejorado de Dust (RTWSM y CSM). Desactivado, Kenshi usa su filtrado original.
desc:Shadows:Shadow Resolution=Sobrescribe la resolución del atlas de sombras. Vanilla = sin sobrescribir (coste cero). Valores más altos dan sombras más nítidas, pero el tiempo de GPU y la VRAM del renderizado de sombras crecen en proporción (16384 ≈ 1 GB); por encima de 8192 la tasa de fotogramas puede bajar notablemente. Se aplica en el siguiente fotograma.
desc:Shadows:Shadow Range=Distancia máxima de renderizado de sombras. Evita el límite de 9000 del menú de opciones del juego. Se aplica en vivo (las divisiones de cascadas y la cámara de sombras se recalculan en el siguiente fotograma) y se escribe en settings.cfg para que sobreviva al reinicio. Mover el control de distancia de sombras dentro del juego sobrescribe este valor.
desc:Shadows:Filter Radius=Radio del filtro de suavizado de sombras (solo RTWSM).
desc:Shadows:Light Size=Tamaño de luz simulado para sombras con endurecimiento por contacto (PCSS de RTWSM).
desc:Shadows:PCSS=Activa las sombras suaves PCSS (Percentage-Closer Soft Shadows) para RTWSM (suavidad según la distancia).
desc:Shadows:Cliff Shadow Fix=Reduce el acné de sombras en acantilados escarpados y superficies verticales (solo RTWSM). Puede atenuar las sombras verticales cercanas. Integrado del mod Cliff Face Shadow Fix de Crunk Aint Dead.
desc:Shadows:Cliff Fix Distance=Rango en el que la corrección de acantilados se aplica progresivamente, como fracción del alcance de sombras; más alto = se conservan más sombras verticales cercanas.
desc:Shadows:Cascade Lambda=Distribución de las divisiones de cascadas PSSM. 0,95 (predeterminado) mantiene las divisiones nativas de Kenshi; cualquier otro valor las sobrescribe: 0,0 = puramente lineal (las sombras cercanas cubren más lejos pero son más pixeladas), 1,0 = puramente logarítmico (sombras cercanas pequeñas y nítidas, cascadas lejanas más grandes).
desc:Shadows:CSM Filter Radius=Multiplicador global del radio del filtro PCF de las CSM, aplicado sobre el radio por cascada original de Kenshi.
desc:Shadows:Cascade Blending=Funde suavemente las cascadas CSM vecinas cerca de sus límites de división para ocultar el salto brusco de resolución en las fronteras.
desc:Shadows:Cascade Blend Width=Anchura de la zona de fundido en cada límite de cascada, como fracción de la profundidad de la cascada (0,05 = sutil, 0,25 = amplia).
desc:Shadows:CSM Far Softness=Controla solo la suavidad de la cascada más lejana, sin afectar a las cascadas cercanas/medias. Más bajo = más nítido, más alto = más suave.

