Click to rebind the overlay toggle key=Haz clic para reasignar la tecla que abre el menú
tip:Toggle Effects hotkey=Haz clic para reasignar el atajo que activa/desactiva todos los efectos. Funciona tanto con el menú abierto como cerrado. Para quitar la asignación, pon ToggleEffectsKey=0 en Dust.ini.
tip:Show Motion Vectors=Superposición de depuración del búfer de vectores de movimiento: gris = quieto, color = dirección/magnitud del movimiento, rojo = sin vector. Observa la hierba y la vegetación mientras te mueves; si se mantienen grises al mecerse, no tienen vector válido y producirán estelas con DLAA.
tip:Upscaling=Antialiasing temporal / escalado. DLAA = solo NVIDIA RTX (mejor calidad). FSR2 = cualquier GPU (D3D11 nativo). FSR3 / FSR4 = cualquier GPU DX12 mediante un dispositivo D3D12 secundario; FSR4 requiere una Radeon RX 9000. Desactivado = apagado.
DLAA unavailable (needs NVIDIA RTX + recent driver)=DLAA no disponible (requiere NVIDIA RTX y un controlador reciente)
tip:DLAA model=Modelo DLAA. F = CNN (recomendado). K/J son el transformer de DLSS 4: los más nítidos en teoría, pero en esta integración emborronan toda la imagen cuando la escena está estática. Cambiarlo reconstruye la función en el siguiente fotograma.
Sharpness=Nitidez
tip:Sharpness=Enfoque con contraste limitado (RCAS) sobre la salida escalada: añade detalle sin el aumento de contraste/halo de Claridad. Valores altos pueden reintroducir dientes de sierra.
Show Motion Vectors=Mostrar vectores de movimiento
Restart the game to enable motion vectors=Reinicia el juego para activar los vectores de movimiento
tip:Restart for motion vectors=La salida de vectores de movimiento se compila en los shaders del juego al iniciar Kenshi. Esta sesión empezó con el escalado desactivado, así que los shaders no tienen salida de velocidad: los objetos en movimiento dejarán estelas hasta que reinicies el juego. El ajuste queda guardado; el próximo inicio compilará los shaders con vectores de movimiento.
Motion Vectors=Vectores de movimiento
UI theme. Kenshi: desaturated grey-tan palette matching the game. Dark: ImGui default.=Tema de la interfaz. Kenshi: paleta gris-beige desaturada a juego con el juego. Oscuro: tema predeterminado de ImGui.
