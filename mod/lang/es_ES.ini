Write timestamped logs to the logs/ folder next to the DLL. Only the 10 newest sessions are kept (20 MB max each), so disk usage stays bounded. Needed for useful bug reports.=Escribe registros con marca de tiempo en la carpeta logs/ junto a la DLL. Solo se conservan las 10 sesiones más recientes (20 MB máx. cada una), así que el uso de disco queda acotado. Necesario para informes de errores útiles.
