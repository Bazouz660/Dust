desc:Bloom:Enabled=Activa o desactiva el efecto bloom.
desc:Bloom:Intensity=Multiplicador global del brillo del bloom.
desc:Bloom:Threshold=Brillo mínimo para que un píxel contribuya al bloom.
desc:Bloom:Soft Knee=Suavidad del corte del umbral (0 = umbral duro, 1 = umbral suave).
desc:Bloom:Radius=Tamaño del núcleo de desenfoque del bloom.
desc:Bloom:Curve=Controla la curva de atenuación del bloom alrededor de las zonas brillantes.
desc:Bloom:Scatter=Cuánto se dispersa el bloom entre los niveles de mip (más alto = resplandor más amplio).
desc:Bloom:Glow Amount=Dispersión adicional de los mips más profundos para un resplandor más visible alrededor de los objetos brillantes.
desc:Bloom:Mip Levels=Número de pasadas de desenfoque (más = bloom más amplio, más costoso).
desc:Bloom:Debug View=Muestra la contribución bruta del bloom antes de la composición.

desc:Clarity:Enabled=Activa o desactiva el efecto de claridad.
desc:Clarity:Strength=Fuerza del realce de contraste local.
desc:Clarity:Midtone Protect=Protege los medios tonos de un enfoque excesivo (0 = sin protección).
desc:Clarity:Blur Radius=Radio de desenfoque para la extracción de detalle.
desc:Clarity:Debug View=Muestra la capa de detalle extraída.

desc:Chromatic Aberration:Enabled=Activa o desactiva la aberración cromática.
desc:Chromatic Aberration:Strength=Fuerza de los halos RGB en los bordes de la pantalla.
desc:Chromatic Aberration:Debug View=Muestra la magnitud del desplazamiento como mapa de calor.

desc:Deband:Enabled=Activa o desactiva el deband.
desc:Deband:Threshold=Diferencia de color máxima considerada banding.
desc:Deband:Range=Radio de búsqueda en píxeles para el muestreo promediado.
desc:Deband:Intensity=Fuerza de mezcla del resultado del deband.
desc:Deband:Sky Only=Aplica el deband solo a los píxeles del cielo.
desc:Deband:Sky Threshold=Los píxeles más allá de este valor de profundidad se consideran cielo.
desc:Deband:Debug View=Resalta las zonas afectadas por el deband.

desc:Depth of Field:Enabled=Activa o desactiva la profundidad de campo.
desc:Depth of Field:Auto Focus=Enfoca automáticamente el objeto del centro de la pantalla.
desc:Depth of Field:Focus Speed=Velocidad con la que el enfoque automático se adapta a un nuevo objetivo.
desc:Depth of Field:Focus Distance=Distancia de enfoque manual (se usa con el enfoque automático desactivado).
desc:Depth of Field:Near Start=Distancia delante del punto de enfoque donde empieza el desenfoque cercano.
desc:Depth of Field:Near End=Distancia delante del punto de enfoque donde el desenfoque cercano alcanza su máximo.
desc:Depth of Field:Near Strength=Fuerza máxima del desenfoque cercano (0 = sin desenfoque cercano).
desc:Depth of Field:Far Start=Distancia detrás del punto de enfoque donde empieza el desenfoque lejano.
desc:Depth of Field:Far End=Distancia detrás del punto de enfoque donde el desenfoque lejano alcanza su máximo.
desc:Depth of Field:Far Strength=Fuerza máxima del desenfoque lejano (0 = sin desenfoque lejano).
desc:Depth of Field:Blur Radius=Tamaño del núcleo de desenfoque en píxeles.
desc:Depth of Field:Blur Downscale=Divisor de resolución de la pasada de desenfoque (2 = media resolución, 4 = un cuarto).
desc:Depth of Field:Blur Shape=Forma del núcleo de desenfoque en las zonas fuera de foco.
desc:Depth of Field:Max Depth=Profundidad máxima procesada (omite objetos lejanos y cielo).
desc:Depth of Field:Physical DoF=Usa un modelo de apertura de lente delgada en lugar de rampas manuales de desenfoque cercano/lejano.
desc:Depth of Field:Aperture=Tamaño de apertura del objetivo para la profundidad de campo física (menor = más profundidad enfocada).
desc:Depth of Field:Highlight Threshold=Las luces altas por encima de este brillo atraviesan el desenfoque.
desc:Depth of Field:Highlight Boost=Fuerza con la que las luces altas atraviesan las zonas desenfocadas.
desc:Depth of Field:Debug View=Visualiza el círculo de confusión como superposición de color.

desc:Film Grain:Enabled=Activa o desactiva el grano de película.
desc:Film Grain:Intensity=Fuerza del ruido de grano.
desc:Film Grain:Size=Tamaño del grano en píxeles.
desc:Film Grain:Colored=Usa ruido de color en lugar de ruido solo de luminancia.
desc:Film Grain:Debug View=Muestra el patrón de ruido bruto.

desc:Kuwahara:Enabled=Activa o desactiva el filtro pictórico Kuwahara.
desc:Kuwahara:Radius=Radio del núcleo del filtro (mayor = estilización más fuerte).
desc:Kuwahara:Strength=Proporción de mezcla entre la imagen original y la filtrada.
desc:Kuwahara:Sharpness=Nitidez de la preservación de bordes (más alto = límites más definidos).
desc:Kuwahara:Debug View=Muestra el resultado filtrado sin mezclarlo con el original.

desc:Letterbox:Enabled=Activa o desactiva las bandas negras cinematográficas.
desc:Letterbox:Aspect Ratio=Relación de aspecto objetivo (aparecen bandas cuando es más ancha que la pantalla).
desc:Letterbox:Opacity=Opacidad de las bandas (0 = transparentes, 1 = sólidas).
desc:Letterbox:Bar Red=Componente rojo del color de las bandas.
desc:Letterbox:Bar Green=Componente verde del color de las bandas.
desc:Letterbox:Bar Blue=Componente azul del color de las bandas.
desc:Letterbox:Debug View=Resalta la zona de las bandas.

desc:LUT:Enabled=Activa o desactiva la gradación de color.
desc:LUT:Tonemapper=Operador de mapeo tonal de HDR a LDR.
desc:LUT:Exposure=Ajuste global de exposición, en pasos EV.
desc:LUT:Auto Exposure=Ajusta automáticamente la exposición según el brillo de la escena.
desc:LUT:Adaptation Speed=Velocidad con la que la exposición automática se adapta a los cambios de brillo.
desc:LUT:Min Auto EV=Valor de exposición mínimo para la exposición automática.
desc:LUT:Max Auto EV=Valor de exposición máximo para la exposición automática.
desc:LUT:Intensity=Factor de mezcla de la LUT de gradación (0 = omitida).
desc:LUT:Lift (Shadows)=Desplazamiento de brillo aplicado a los tonos oscuros.
desc:LUT:Gamma (Midtones)=Ajuste de la curva gamma de los medios tonos.
desc:LUT:Gain (Highlights)=Multiplicador de brillo de las luces altas.
desc:LUT:Contrast=Ajuste global de contraste.
desc:LUT:Saturation=Multiplicador de saturación de color (0 = escala de grises).
desc:LUT:Temperature=Desplazamiento del balance de blancos (negativo = más frío, positivo = más cálido).
desc:LUT:Tint=Desplazamiento de tinte verde-magenta.
desc:LUT:Shadow Red=Tinte rojo de las zonas de sombra.
desc:LUT:Shadow Green=Tinte verde de las zonas de sombra.
desc:LUT:Shadow Blue=Tinte azul de las zonas de sombra.
desc:LUT:Highlight Red=Tinte rojo de las luces altas.
desc:LUT:Highlight Green=Tinte verde de las luces altas.
desc:LUT:Highlight Blue=Tinte azul de las luces altas.

desc:Outline:Enabled=Activa o desactiva el contorno.
desc:Outline:Depth Threshold=Diferencia de profundidad mínima para dibujar un contorno.
desc:Outline:Normal Threshold=Diferencia de normales mínima para dibujar un contorno.
desc:Outline:Thickness=Grosor del contorno en píxeles.
desc:Outline:Strength=Opacidad del contorno (0 = invisible, 1 = totalmente opaco).
desc:Outline:Color R=Componente rojo del color del contorno.
desc:Outline:Color G=Componente verde del color del contorno.
desc:Outline:Color B=Componente azul del color del contorno.
desc:Outline:Max Depth=Profundidad máxima para dibujar contornos (omite objetos lejanos).
desc:Outline:Debug View=Muestra el resultado bruto de la detección de bordes.

desc:RTGI:Enabled=Activa o desactiva la iluminación global por trazado de rayos.
desc:RTGI:GI Intensity=Brillo del rebote de luz indirecta.
desc:RTGI:AO Intensity=Fuerza del oscurecimiento por oclusión ambiental.
desc:RTGI:Shadow Contrast=Contraste de la oclusión GI direccional. Por encima de 1 se oscurecen las grietas y la parte inferior de los objetos; 1,0 = AO lineal normal.
desc:RTGI:Ray Length=Radio de recolección de GI (distancia de marcha de horizonte en espacio de pantalla).
desc:RTGI:Steps Per Slice=Muestras de profundidad por corte de horizonte (más = mejor calidad, más costoso).
desc:RTGI:Slices=Número de direcciones de corte de horizonte por píxel (más = menos ruido, más costoso).
desc:RTGI:Thickness=Grosor supuesto de los oclusores detrás de las superficies visibles.
desc:RTGI:Thickness Curve=Cómo escala el grosor con la distancia.
desc:RTGI:Fade Distance=Distancia a la que el efecto se desvanece.
desc:RTGI:Normal Detail=Influencia del mapa de normales (0 = geometría lisa, 1 = detalle completo).
desc:RTGI:Bounce Intensity=Fuerza del rebote de luz secundario.
desc:RTGI:Saturation=Saturación del color de la luz indirecta.
desc:RTGI:Denoise Steps=Número de pasadas de reducción de ruido espacial.
desc:RTGI:Depth Sigma=Sensibilidad a la profundidad del reductor de ruido.
desc:RTGI:Color Phi=Sensibilidad al color del reductor de ruido.
desc:RTGI:Resolution %=Renderiza a un porcentaje de la resolución nativa (más bajo = más rápido).
desc:RTGI:Debug View=Modo de visualización de depuración (0 = apagado).

desc:SMAA:Enabled=Activa o desactiva el antialiasing.
desc:SMAA:Mode=Método de detección de bordes: luminancia, profundidad o ambos.
desc:SMAA:Luma Threshold=Sensibilidad de la detección de bordes por luminancia (más bajo = se detectan más bordes).
desc:SMAA:Depth Threshold=Sensibilidad de la detección de bordes por profundidad (más bajo = se detectan más bordes).
desc:SMAA:Show Edges=Visualiza los bordes detectados.
desc:SMAA:Show Weights=Visualiza los pesos de mezcla.

desc:SSAO:Enabled=Activa o desactiva la oclusión ambiental.
desc:SSAO:Radius=Radio de muestreo en espacio de mundo para la prueba de oclusión.
desc:SSAO:Strength=Fuerza del oscurecimiento por oclusión.
desc:SSAO:Bias=Sesgo para evitar artefactos de autooclusión.
desc:SSAO:Max Depth=Profundidad máxima a la que se aplica la oclusión.
desc:SSAO:Filter Radius=Radio de desenfoque para suavizar el resultado de AO.
desc:SSAO:Foreground Fade=Velocidad con la que el efecto se desvanece en objetos muy cercanos.
desc:SSAO:Falloff Power=Velocidad con la que la oclusión se atenúa con la distancia de muestreo.
desc:SSAO:Max Screen Radius=Radio de muestreo máximo en espacio de pantalla.
desc:SSAO:Min Screen Radius=Radio de muestreo mínimo en espacio de pantalla.
desc:SSAO:Blur Sharpness=Nitidez del desenfoque sensible a bordes (más alto = se conserva más detalle).
desc:SSAO:Normal Detail=Influencia del mapa de normales (0 = geometría lisa, 1 = detalle completo).
desc:SSAO:Direct Light AO=Cuánto afecta la AO a las zonas con luz directa.
desc:SSAO:Samples=Número de direcciones de muestreo por píxel.
desc:SSAO:Steps=Número de muestras por dirección.
desc:SSAO:Debug View=Muestra la oclusión ambiental bruta antes de la composición.

desc:SSIL:Enabled=Activa o desactiva la iluminación indirecta en espacio de pantalla.
desc:SSIL:Radius=Radio de muestreo de la luz indirecta.
desc:SSIL:Strength=Fuerza de la contribución de luz indirecta.
desc:SSIL:Bias=Sesgo para evitar artefactos de autoiluminación.
desc:SSIL:Max Depth=Profundidad máxima a la que se aplica el efecto.
desc:SSIL:Foreground Fade=Velocidad con la que el efecto se desvanece en objetos muy cercanos.
desc:SSIL:Falloff Power=Velocidad con la que la contribución de luz se atenúa con la distancia.
desc:SSIL:Max Screen Radius=Radio de muestreo máximo en espacio de pantalla.
desc:SSIL:Min Screen Radius=Radio de muestreo mínimo en espacio de pantalla.
desc:SSIL:Color Bleeding=Cuánto se transfiere el color de las superficies cercanas a las superficies adyacentes.
desc:SSIL:Directions=Número de direcciones de muestreo por píxel.
desc:SSIL:Steps=Número de muestras por dirección.
desc:SSIL:Blur Sharpness=Nitidez del desenfoque sensible a bordes (más alto = se conserva más detalle).
desc:SSIL:Debug View=Muestra la luz indirecta bruta antes de la composición.

desc:Vignette:Enabled=Activa o desactiva el efecto de viñeta.
desc:Vignette:Intensity=Fuerza de la viñeta.
desc:Vignette:Radius=Radio de la viñeta.
desc:Vignette:Softness=Suavidad del borde de la viñeta.
desc:Vignette:Roundness=Redondez de la forma de la viñeta.
desc:Vignette:Center X=Coordenada X del centro de la viñeta.
desc:Vignette:Center Y=Coordenada Y del centro de la viñeta.
desc:Vignette:Debug View=Muestra la vista de depuración de la viñeta.
desc:Vignette:Shape=Estilo de forma de la viñeta.
