Vanilla (no override)=Vanilla (keine Überschreibung)
desc:Shadows:Enabled=Aktiviert oder deaktiviert Dusts verbesserte Schattenfilterung (RTWSM und CSM). Deaktiviert verwendet Kenshi seine ursprüngliche Filterung.
desc:Shadows:Shadow Resolution=Überschreibt die Auflösung des Schattenatlas. Vanilla = keine Überschreibung (keine Kosten). Höhere Werte ergeben schärfere Schatten, erhöhen aber GPU-Zeit und VRAM des Schattenrenderings proportional (16384 ≈ 1 GB); über 8192 kann die Bildrate deutlich sinken. Wirkt im nächsten Frame.
desc:Shadows:Shadow Range=Maximale Renderdistanz für Schatten. Umgeht das Limit von 9000 im Optionsmenü des Spiels. Wird sofort angewendet (Kaskadenaufteilung und Schattenkamera werden im nächsten Frame neu berechnet) und in settings.cfg geschrieben, damit sie den Neustart überlebt. Das Bewegen des Schattendistanz-Reglers im Spiel überschreibt diesen Wert.
desc:Shadows:Filter Radius=Filterradius zum Weichzeichnen der Schatten (nur RTWSM).
desc:Shadows:Light Size=Simulierte Lichtgröße für kontaktabhängig härtere Schatten (RTWSM PCSS).
desc:Shadows:PCSS=Aktiviert PCSS (Percentage-Closer Soft Shadows) für RTWSM (distanzabhängige Weichheit).
desc:Shadows:Cliff Shadow Fix=Reduziert Schattenakne an steilen Klippen und senkrechten Flächen (nur RTWSM). Kann nahe senkrechte Schatten ausblenden. Integriert aus dem Mod Cliff Face Shadow Fix von Crunk Aint Dead.
desc:Shadows:Cliff Fix Distance=Bereich, über den die Klippenkorrektur sanft einsetzt, als Anteil der Schattenreichweite; höher = mehr nahe senkrechte Schatten bleiben erhalten.
desc:Shadows:Cascade Lambda=Verteilung der PSSM-Kaskadenaufteilung. 0,95 (Standard) behält Kenshis native Aufteilung; jeder andere Wert überschreibt sie: 0,0 = rein linear (nahe Schatten reichen weiter, sind aber blockiger), 1,0 = rein logarithmisch (nahe Schatten klein und scharf, ferne Kaskaden größer).
desc:Shadows:CSM Filter Radius=Globaler Multiplikator für den CSM-PCF-Filterradius, zusätzlich zu Kenshis ursprünglichem, pro Kaskade abgestuftem Radius.
desc:Shadows:Cascade Blending=Blendet benachbarte CSM-Kaskaden nahe ihrer Aufteilungsgrenzen weich ineinander, um den harten Auflösungssprung an den Grenzen zu verbergen.
desc:Shadows:Cascade Blend Width=Breite des Überblendbereichs an jeder Kaskadengrenze, als Anteil der Kaskadentiefe (0,05 = dezent, 0,25 = breit).
desc:Shadows:CSM Far Softness=Steuert nur die Weichheit der fernsten Kaskade, ohne die nahen/mittleren Kaskaden zu beeinflussen. Niedriger = schärfer, höher = weicher.

