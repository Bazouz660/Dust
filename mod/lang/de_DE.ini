desc:Outline:Color B=Blauanteil der Umrissfarbe.
desc:Outline:Max Depth=Maximale Tiefe für Umrisse (überspringt ferne Objekte).
desc:Outline:Debug View=Zeigt das rohe Ergebnis der Kantenerkennung.

desc:RTGI:Enabled=Aktiviert oder deaktiviert die raytraced globale Beleuchtung.
desc:RTGI:GI Intensity=Helligkeit des indirekten Lichtbounces.
desc:RTGI:AO Intensity=Stärke der Verdunkelung durch Ambient Occlusion.
desc:RTGI:Shadow Contrast=Kontrast der gerichteten GI-Verdeckung. Über 1 werden Spalten und Bereiche unter Objekten dunkler; 1,0 = normale lineare AO.
desc:RTGI:Ray Length=GI-Sammelradius (Horizon-Marching-Distanz im Bildschirmraum).
desc:RTGI:Steps Per Slice=Tiefen-Samples pro Horizon-Segment (mehr = bessere Qualität, teurer).
desc:RTGI:Slices=Anzahl der Horizon-Segmentrichtungen pro Pixel (mehr = weniger Rauschen, teurer).
