desc:RTGI:Fade Distance=Distanz, ab der der Effekt ausgeblendet wird.
desc:RTGI:Normal Detail=Einfluss der Normal Map (0 = glatte Geometrie, 1 = volles Detail).
desc:RTGI:Bounce Intensity=Stärke des sekundären Lichtbounces.
desc:RTGI:Saturation=Farbsättigung des indirekten Lichts.
desc:RTGI:Denoise Steps=Anzahl der räumlichen Entrausch-Durchgänge.
