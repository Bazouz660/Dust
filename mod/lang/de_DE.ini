desc:Letterbox:Bar Red=Rotanteil der Balkenfarbe.
desc:Letterbox:Bar Green=Grünanteil der Balkenfarbe.
desc:Letterbox:Bar Blue=Blauanteil der Balkenfarbe.
desc:Letterbox:Debug View=Hebt den Balkenbereich hervor.

