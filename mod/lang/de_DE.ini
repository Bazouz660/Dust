desc:Bloom:Enabled=Aktiviert oder deaktiviert den Bloom-Effekt.
desc:Bloom:Intensity=Globaler Helligkeitsmultiplikator des Blooms.
desc:Bloom:Threshold=Mindesthelligkeit, ab der ein Pixel zum Bloom beiträgt.
desc:Bloom:Soft Knee=Weichheit der Schwellenwertkante (0 = harte Schwelle, 1 = weiche Schwelle).
desc:Bloom:Radius=Größe des Bloom-Unschärfekerns.
desc:Bloom:Curve=Steuert die Abfallkurve des Blooms um helle Bereiche.
desc:Bloom:Scatter=Wie weit der Bloom über die Mip-Stufen streut (höher = breiterer Schein).
desc:Bloom:Glow Amount=Zusätzliche Streuung der tieferen Mips für einen sichtbareren Schein um helle Objekte.
desc:Bloom:Mip Levels=Anzahl der Unschärfe-Durchgänge (mehr = breiterer Bloom, teurer).
desc:Bloom:Debug View=Zeigt den rohen Bloom-Beitrag vor dem Compositing.

desc:Clarity:Enabled=Aktiviert oder deaktiviert den Klarheitseffekt.
desc:Clarity:Strength=Stärke der lokalen Kontrastverstärkung.
desc:Clarity:Midtone Protect=Schützt Mitteltöne vor Überschärfung (0 = kein Schutz).
desc:Clarity:Blur Radius=Unschärferadius für die Detailextraktion.
desc:Clarity:Debug View=Zeigt die extrahierte Detailebene.

desc:Chromatic Aberration:Enabled=Aktiviert oder deaktiviert die chromatische Aberration.
desc:Chromatic Aberration:Strength=Stärke der RGB-Farbsäume an den Bildschirmrändern.
desc:Chromatic Aberration:Debug View=Zeigt die Verschiebungsstärke als Heatmap.

desc:Deband:Enabled=Aktiviert oder deaktiviert Deband.
desc:Deband:Threshold=Maximaler Farbunterschied, der als Banding gilt.
desc:Deband:Range=Suchradius in Pixeln für die Mittelwertbildung.
desc:Deband:Intensity=Mischstärke des Deband-Ergebnisses.
desc:Deband:Sky Only=Wendet Deband nur auf Himmelpixel an.
desc:Deband:Sky Threshold=Pixel jenseits dieses Tiefenwerts gelten als Himmel.
desc:Deband:Debug View=Hebt die von Deband betroffenen Bereiche hervor.

desc:Depth of Field:Enabled=Aktiviert oder deaktiviert die Tiefenschärfe.
desc:Depth of Field:Auto Focus=Fokussiert automatisch auf das Objekt in der Bildschirmmitte.
desc:Depth of Field:Focus Speed=Wie schnell sich der Autofokus an ein neues Ziel anpasst.
desc:Depth of Field:Focus Distance=Manuelle Fokusdistanz (wird bei deaktiviertem Autofokus verwendet).
desc:Depth of Field:Near Start=Distanz vor dem Fokuspunkt, ab der die Nahunschärfe beginnt.
desc:Depth of Field:Near End=Distanz vor dem Fokuspunkt, ab der die Nahunschärfe ihr Maximum erreicht.
desc:Depth of Field:Near Strength=Maximale Stärke der Nahunschärfe (0 = keine Nahunschärfe).
desc:Depth of Field:Far Start=Distanz hinter dem Fokuspunkt, ab der die Fernunschärfe beginnt.
desc:Depth of Field:Far End=Distanz hinter dem Fokuspunkt, ab der die Fernunschärfe ihr Maximum erreicht.
desc:Depth of Field:Far Strength=Maximale Stärke der Fernunschärfe (0 = keine Fernunschärfe).
desc:Depth of Field:Blur Radius=Größe des Unschärfekerns in Pixeln.
desc:Depth of Field:Blur Downscale=Auflösungsteiler des Unschärfe-Durchgangs (2 = halbe Auflösung, 4 = viertel).
desc:Depth of Field:Blur Shape=Form des Unschärfekerns in unscharfen Bereichen.
desc:Depth of Field:Max Depth=Maximal verarbeitete Tiefe (überspringt ferne Objekte und Himmel).
desc:Depth of Field:Physical DoF=Verwendet ein Dünnlinsen-Blendenmodell statt manueller Nah-/Fern-Unschärferampen.
desc:Depth of Field:Aperture=Blendengröße des Objektivs für die physikalische Tiefenschärfe (kleiner = größerer Schärfebereich).
desc:Depth of Field:Highlight Threshold=Glanzlichter über dieser Helligkeit scheinen durch die Unschärfe.
desc:Depth of Field:Highlight Boost=Wie stark Glanzlichter durch unscharfe Bereiche scheinen.
desc:Depth of Field:Debug View=Visualisiert den Zerstreuungskreis als farbiges Overlay.

desc:Film Grain:Enabled=Aktiviert oder deaktiviert die Filmkörnung.
desc:Film Grain:Intensity=Stärke des Körnungsrauschens.
desc:Film Grain:Size=Korngröße in Pixeln.
desc:Film Grain:Colored=Verwendet farbiges Rauschen statt reinem Luminanzrauschen.
desc:Film Grain:Debug View=Zeigt das rohe Rauschmuster.

desc:Kuwahara:Enabled=Aktiviert oder deaktiviert den Kuwahara-Malfilter.
