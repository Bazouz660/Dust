desc:Outline:Normal Threshold=Minimaler Normalenunterschied, um einen Umriss zu zeichnen.
desc:Outline:Thickness=Umrissbreite in Pixeln.
desc:Outline:Strength=Deckkraft des Umrisses (0 = unsichtbar, 1 = vollständig deckend).
desc:Outline:Color R=Rotanteil der Umrissfarbe.
