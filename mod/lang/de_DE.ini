Click to rebind the overlay toggle key=Klicken, um die Taste zum Öffnen des Overlays neu zu belegen
tip:Toggle Effects hotkey=Klicken, um den Hotkey zum Ein-/Ausschalten aller Effekte neu zu belegen. Funktioniert unabhängig davon, ob das Menü geöffnet ist. Zum Aufheben ToggleEffectsKey=0 in Dust.ini setzen.
tip:Show Motion Vectors=Debug-Overlay des Bewegungsvektor-Puffers: grau = still, farbig = Bewegungsrichtung/-stärke, rot = kein Bewegungsvektor. Beobachte Gras und Vegetation beim Bewegen; bleibt es beim Wiegen grau, hat es keinen gültigen Bewegungsvektor und erzeugt unter DLAA Geisterbilder.
tip:Upscaling=Temporales Anti-Aliasing / Hochskalierung. DLAA = nur NVIDIA RTX (beste Qualität). FSR2 = jede GPU (natives D3D11). FSR3 / FSR4 = jede DX12-GPU über ein D3D12-Nebengerät; FSR4 benötigt eine Radeon RX 9000. Deaktiviert = aus.
DLAA unavailable (needs NVIDIA RTX + recent driver)=DLAA nicht verfügbar (benötigt NVIDIA RTX + aktuellen Treiber)
tip:DLAA model=DLAA-Modell. F = CNN (empfohlen). K/J sind der DLSS-4-Transformer: theoretisch am schärfsten, verwischen in dieser Integration aber das ganze Bild, wenn die Szene statisch ist. Eine Änderung baut das Feature im nächsten Frame neu auf.
Sharpness=Schärfe
tip:Sharpness=Kontrastbegrenztes Schärfen (RCAS) auf der hochskalierten Ausgabe. Fügt Details hinzu, ohne die Kontrast-/Halo-Verstärkung von Klarheit. Höhere Werte können wieder Treppeneffekte erzeugen.
Show Motion Vectors=Bewegungsvektoren anzeigen
Restart the game to enable motion vectors=Spiel neu starten, um Bewegungsvektoren zu aktivieren
tip:Restart for motion vectors=Die Bewegungsvektor-Ausgabe wird beim Start von Kenshi in die Spiel-Shader kompiliert. Diese Sitzung wurde mit deaktivierter Hochskalierung gestartet, daher haben die Shader keine Geschwindigkeitsausgabe: Bewegte Objekte erzeugen Geisterbilder, bis das Spiel neu gestartet wird. Die Einstellung ist gespeichert; der nächste Start kompiliert die Shader mit Bewegungsvektoren.
Motion Vectors=Bewegungsvektoren
UI theme. Kenshi: desaturated grey-tan palette matching the game. Dark: ImGui default.=UI-Design. Kenshi: entsättigte grau-beige Palette passend zum Spiel. Dunkel: ImGui-Standard.
