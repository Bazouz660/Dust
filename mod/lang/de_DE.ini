desc:Kuwahara:Strength=Mischverhältnis zwischen Originalbild und gefiltertem Bild.
desc:Kuwahara:Sharpness=Schärfe der Kantenerhaltung (höher = schärfere Grenzen).
desc:Kuwahara:Debug View=Zeigt das gefilterte Ergebnis ohne Mischung mit dem Original.

