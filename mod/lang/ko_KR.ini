desc:Shadows:Enabled=Dust의 개선된 그림자 필터링(RTWSM 및 CSM)을 켜거나 끕니다. 끄면 Kenshi의 원래 필터링을 사용합니다.
desc:Shadows:Shadow Resolution=그림자 아틀라스 해상도를 덮어씁니다. 바닐라 = 덮어쓰지 않음 (비용 없음). 값이 높을수록 그림자가 선명해지지만 그림자 렌더링의 GPU 시간과 VRAM이 비례하여 증가합니다 (16384는 약 1 GB). 8192를 넘으면 프레임률이 크게 떨어질 수 있습니다. 다음 프레임에 적용됩니다.
desc:Shadows:Shadow Range=그림자 최대 렌더링 거리. 게임 옵션 메뉴의 9000 제한을 우회합니다. 즉시 적용되며(캐스케이드 분할과 그림자 카메라는 다음 프레임에 다시 계산) 재시작 후에도 유지되도록 settings.cfg에 기록됩니다. 게임 내 그림자 거리 슬라이더를 움직이면 이 값이 덮어써집니다.
desc:Shadows:Filter Radius=그림자를 부드럽게 하는 필터 반경 (RTWSM 전용).
desc:Shadows:Light Size=접촉 부분이 단단해지는 그림자를 위한 가상 광원 크기 (RTWSM PCSS).
desc:Shadows:PCSS=RTWSM에서 PCSS(Percentage-Closer Soft Shadows)를 사용합니다 (거리 기반 부드러움).
desc:Shadows:Cliff Shadow Fix=가파른 절벽과 수직면의 섀도우 아크네를 줄입니다 (RTWSM 전용). 가까운 수직 그림자가 옅어질 수 있습니다. Crunk Aint Dead의 Cliff Face Shadow Fix 모드에서 통합했습니다.
desc:Shadows:Cliff Fix Distance=절벽 보정이 서서히 적용되는 범위. 그림자 거리에 대한 비율이며, 높을수록 가까운 수직 그림자가 더 많이 유지됩니다.
desc:Shadows:Cascade Lambda=PSSM 캐스케이드 분할 분포. 0.95(기본값)는 Kenshi 고유의 분할을 유지하고, 다른 값은 이를 덮어씁니다. 0.0 = 완전 선형 (가까운 그림자가 더 멀리 닿지만 블록 현상 증가), 1.0 = 완전 로그 (가까운 그림자는 작고 선명, 먼 캐스케이드는 더 큼).
desc:Shadows:CSM Filter Radius=CSM PCF 필터 반경의 전역 배율. Kenshi 원래의 캐스케이드별 단계 반경 위에 적용됩니다.
desc:Shadows:Cascade Blending=인접한 CSM 캐스케이드를 분할 경계 근처에서 부드럽게 섞어 경계의 급격한 해상도 변화를 숨깁니다.
desc:Shadows:Cascade Blend Width=각 캐스케이드 경계의 블렌드 영역 폭. 캐스케이드 깊이 범위에 대한 비율 (0.05 = 미세, 0.25 = 넓음).
desc:Shadows:CSM Far Softness=가장 먼 캐스케이드의 부드러움만 조절하며 근/중거리 캐스케이드에는 영향을 주지 않습니다. 낮을수록 선명, 높을수록 부드러움.

