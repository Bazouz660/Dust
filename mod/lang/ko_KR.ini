desc:Bloom:Enabled=블룸 효과를 켜거나 끕니다.
desc:Bloom:Intensity=블룸 전체 밝기 배율.
desc:Bloom:Threshold=픽셀이 블룸에 기여하는 최소 밝기.
desc:Bloom:Soft Knee=임계값 컷오프의 부드러움 (0 = 하드, 1 = 소프트).
desc:Bloom:Radius=블룸 블러 커널 크기.
desc:Bloom:Curve=밝은 영역 주위에서 블룸이 감쇠하는 곡선을 조절합니다.
desc:Bloom:Scatter=밉 레벨 간에 블룸이 퍼지는 정도 (높을수록 넓은 글로우).
