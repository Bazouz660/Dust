tip:Toggle Effects hotkey=클릭하여 모든 효과를 켜고 끄는 단축키를 다시 지정합니다. 메뉴가 열려 있든 닫혀 있든 작동합니다. 지정을 해제하려면 Dust.ini에서 ToggleEffectsKey=0으로 설정하세요.
tip:Show Motion Vectors=모션 벡터 버퍼의 디버그 오버레이: 회색 = 정지, 색상 = 이동 방향/크기, 빨간색 = 모션 벡터 없음. 이동하면서 풀과 식생을 관찰하세요. 흔들리는데도 회색이면 유효한 모션 벡터가 없어 DLAA에서 잔상이 생깁니다.
tip:Upscaling=시간적 안티앨리어싱 / 업스케일링. DLAA = NVIDIA RTX 전용 (최고 품질). FSR2 = 모든 GPU (네이티브 D3D11). FSR3 / FSR4 = D3D12 보조 장치를 통한 모든 DX12 GPU, FSR4는 Radeon RX 9000이 필요합니다. 사용 안 함 = 끄기.
DLAA unavailable (needs NVIDIA RTX + recent driver)=DLAA를 사용할 수 없습니다 (NVIDIA RTX와 최신 드라이버 필요)
tip:DLAA model=DLAA 모델. F = CNN (권장). K/J는 DLSS 4 트랜스포머로 이론상 가장 선명하지만, 이 통합에서는 장면이 정지해 있을 때 화면 전체가 흐려집니다. 변경하면 다음 프레임에 기능이 다시 생성됩니다.
Sharpness=선명하게
tip:Sharpness=업스케일 출력에 대비 제한 샤프닝(RCAS)을 적용합니다. 선명도 효과의 대비/헤일로 강화 없이 디테일을 더합니다. 값이 높으면 계단 현상이 다시 나타날 수 있습니다.
Show Motion Vectors=모션 벡터 표시
Restart the game to enable motion vectors=모션 벡터를 사용하려면 게임을 다시 시작하세요
tip:Restart for motion vectors=모션 벡터 출력은 Kenshi가 시작될 때 게임 셰이더에 컴파일됩니다. 이번 세션은 업스케일링이 꺼진 상태로 시작되어 셰이더에 속도 출력이 없습니다. 게임을 다시 시작할 때까지 움직이는 물체에 잔상이 생깁니다. 설정은 저장되었으며, 다음 실행 시 모션 벡터가 포함된 셰이더가 컴파일됩니다.
Motion Vectors=모션 벡터
