desc:Shadows:Enabled=Dustの改良版シャドウフィルタリング（RTWSMとCSM）を有効/無効にします。無効時はKenshi本来のフィルタリングを使用します。
desc:Shadows:Shadow Resolution=シャドウアトラスの解像度を上書きします。バニラ = 上書きなし（コストゼロ）。値が高いほど影がシャープになりますが、影の描画にかかるGPU時間とVRAMが比例して増加します（16384で約1 GB）。8192を超えるとフレームレートが大きく低下することがあります。次のフレームで反映されます。
desc:Shadows:Shadow Range=影の最大描画距離。ゲームのオプション画面の上限9000を回避します。即時反映され（カスケード分割と影カメラは次のフレームで再計算）、再起動後も維持されるよう settings.cfg に書き込まれます。ゲーム内で影の距離スライダーを動かすとこの値は上書きされます。
desc:Shadows:Filter Radius=影を柔らかくするフィルター半径（RTWSMのみ）。
desc:Shadows:Light Size=接触部分が硬くなる影のための擬似光源サイズ（RTWSM PCSS）。
desc:Shadows:PCSS=RTWSMでPCSS（Percentage-Closer Soft Shadows）を有効にします（距離に応じた柔らかさ）。
desc:Shadows:Cliff Shadow Fix=急な崖や垂直面のシャドウアクネを軽減します（RTWSMのみ）。近くの垂直な影が薄くなることがあります。Crunk Aint Dead氏のMod「Cliff Face Shadow Fix」を統合。
desc:Shadows:Cliff Fix Distance=崖補正が徐々に効き始める範囲。影の描画距離に対する割合で指定。高いほど近くの垂直な影が多く残ります。
desc:Shadows:Cascade Lambda=PSSMカスケード分割の分布。0.95（既定）はKenshi本来の分割を維持し、それ以外の値は上書きします。0.0 = 完全に線形（近くの影がより遠くまで届くがブロック状になる）、1.0 = 完全に対数（近くの影は小さくシャープ、遠くのカスケードは大きい）。
desc:Shadows:CSM Filter Radius=CSMのPCFフィルター半径の全体倍率。Kenshi本来のカスケードごとの段階的な半径に重ねて適用されます。
desc:Shadows:Cascade Blending=隣接するCSMカスケードを分割境界付近で滑らかにブレンドし、境界での解像度の急変を隠します。
desc:Shadows:Cascade Blend Width=各カスケード境界のブレンド帯の幅。カスケードの深度範囲に対する割合（0.05 = 控えめ、0.25 = 広め）。
desc:Shadows:CSM Far Softness=最も遠いカスケードの柔らかさのみを制御し、近/中距離のカスケードには影響しません。低いほどシャープ、高いほど柔らか。

