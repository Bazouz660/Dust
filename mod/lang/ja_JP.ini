tip:Toggle Effects hotkey=クリックして全エフェクトのオン/オフを切り替えるホットキーを再割り当てします。メニューの開閉に関係なく機能します。割り当てを解除するには Dust.ini で ToggleEffectsKey=0 に設定してください。
tip:Show Motion Vectors=モーションベクトルバッファのデバッグ表示: グレー = 静止、色付き = 移動方向/量、赤 = モーションベクトルなし。移動中に草や植生を観察してください。揺れているのにグレーのままなら有効なモーションベクトルがなく、DLAAでゴーストが出ます。
tip:Upscaling=時間的アンチエイリアス / アップスケーリング。DLAA = NVIDIA RTX専用（最高画質）。FSR2 = 任意のGPU（ネイティブD3D11）。FSR3 / FSR4 = D3D12サイドデバイス経由で任意のDX12 GPU。FSR4はRadeon RX 9000が必要。無効 = オフ。
DLAA unavailable (needs NVIDIA RTX + recent driver)=DLAAは利用できません（NVIDIA RTXと最新のドライバーが必要）
tip:DLAA model=DLAAモデル。F = CNN（推奨）。K/J はDLSS 4 Transformer: 理論上は最もシャープですが、この統合ではシーンが静止していると画面全体がぼやけます。変更すると次のフレームで機能が再構築されます。
Sharpness=シャープネス
tip:Sharpness=アップスケール出力へのコントラスト制限付きシャープ処理（RCAS）。クラリティのようなコントラスト/ハロー強調なしでディテールを加えます。高い値ではエイリアシングが再び現れることがあります。
Show Motion Vectors=モーションベクトルを表示
Restart the game to enable motion vectors=モーションベクトルを有効にするにはゲームを再起動してください
tip:Restart for motion vectors=モーションベクトル出力はKenshi起動時にゲームのシェーダーへコンパイルされます。このセッションはアップスケーリングが無効な状態で開始したため、シェーダーに速度出力がありません。ゲームを再起動するまで動く物体にゴーストが出ます。設定は保存済みで、次回起動時にモーションベクトル付きでシェーダーがコンパイルされます。
Motion Vectors=モーションベクトル
