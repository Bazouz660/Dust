desc:Bloom:Enabled=ブルーム効果を有効/無効にします。
desc:Bloom:Intensity=ブルーム全体の明るさ倍率。
desc:Bloom:Threshold=ピクセルがブルームに寄与する最低輝度。
desc:Bloom:Soft Knee=しきい値カットオフの滑らかさ（0 = ハード、1 = ソフト）。
desc:Bloom:Radius=ブルームのブラーカーネルサイズ。
desc:Bloom:Curve=明るい領域の周囲でブルームが減衰するカーブを制御します。
desc:Bloom:Scatter=ミップレベル間でブルームがどれだけ広がるか（高いほど広いグロー）。
desc:Bloom:Glow Amount=深いミップの追加拡散。明るい物体の周囲のグローを目立たせます。
desc:Bloom:Mip Levels=ブラーパスの数（多いほど広いブルーム、コスト増）。
desc:Bloom:Debug View=合成前の生のブルーム寄与を表示します。

desc:Clarity:Enabled=クラリティ効果を有効/無効にします。
desc:Clarity:Strength=局所コントラスト強調の強さ。
desc:Clarity:Midtone Protect=中間調の過度なシャープ化を防ぎます（0 = 保護なし）。
desc:Clarity:Blur Radius=ディテール抽出用のブラー半径。
desc:Clarity:Debug View=抽出したディテールレイヤーを表示します。

desc:Chromatic Aberration:Enabled=色収差を有効/無効にします。
desc:Chromatic Aberration:Strength=画面端のRGB色ずれの強さ。
desc:Chromatic Aberration:Debug View=ずれ量をヒートマップで表示します。

desc:Deband:Enabled=バンディング除去を有効/無効にします。
desc:Deband:Threshold=バンディングとみなす最大の色差。
desc:Deband:Range=平均化サンプリングのピクセル検索半径。
desc:Deband:Intensity=バンディング除去結果のブレンド強度。
desc:Deband:Sky Only=空のピクセルにのみバンディング除去を適用します。
desc:Deband:Sky Threshold=この深度値を超えるピクセルを空とみなします。
desc:Deband:Debug View=バンディング除去の影響を受けた領域を強調表示します。

desc:Depth of Field:Enabled=被写界深度を有効/無効にします。
desc:Depth of Field:Auto Focus=画面中央の物体に自動でフォーカスします。
desc:Depth of Field:Focus Speed=オートフォーカスが新しい対象に適応する速さ。
desc:Depth of Field:Focus Distance=手動フォーカス距離（オートフォーカス無効時に使用）。
desc:Depth of Field:Near Start=フォーカス点の手前で近景ブラーが始まる距離。
desc:Depth of Field:Near End=フォーカス点の手前で近景ブラーが最大になる距離。
desc:Depth of Field:Near Strength=近景ブラーの最大強度（0 = 近景ブラーなし）。
desc:Depth of Field:Far Start=フォーカス点の奥で遠景ブラーが始まる距離。
desc:Depth of Field:Far End=フォーカス点の奥で遠景ブラーが最大になる距離。
desc:Depth of Field:Far Strength=遠景ブラーの最大強度（0 = 遠景ブラーなし）。
desc:Depth of Field:Blur Radius=ブラーカーネルのサイズ（ピクセル）。
desc:Depth of Field:Blur Downscale=ブラーパスの解像度除数（2 = 半分、4 = 4分の1）。
desc:Depth of Field:Blur Shape=ピンボケ領域のブラーカーネルの形状。
desc:Depth of Field:Max Depth=処理する最大深度（遠くの物体と空をスキップ）。
desc:Depth of Field:Physical DoF=手動の近景/遠景ブラーの代わりに薄レンズ絞りモデルを使用します。
desc:Depth of Field:Aperture=物理的被写界深度のレンズ絞りサイズ（小さいほど深い被写界深度）。
desc:Depth of Field:Highlight Threshold=この明るさを超えるハイライトはブラーを突き抜けます。
desc:Depth of Field:Highlight Boost=ブラー領域でハイライトが突き抜ける強さ。
desc:Depth of Field:Debug View=錯乱円を色付きオーバーレイで可視化します。

desc:Film Grain:Enabled=フィルムグレインを有効/無効にします。
desc:Film Grain:Intensity=グレインノイズの強さ。
desc:Film Grain:Size=グレインのサイズ（ピクセル）。
desc:Film Grain:Colored=輝度のみのノイズではなくカラーノイズを使用します。
desc:Film Grain:Debug View=生のノイズパターンを表示します。

desc:Kuwahara:Enabled=桑原絵画フィルターを有効/無効にします。
desc:Kuwahara:Radius=フィルターカーネルの半径（大きいほど強い様式化）。
desc:Kuwahara:Strength=元画像とフィルター後画像のブレンド比率。
desc:Kuwahara:Sharpness=エッジ保持のシャープさ（高いほど境界が明瞭）。
desc:Kuwahara:Debug View=元画像とブレンドせずにフィルター結果を表示します。

desc:Letterbox:Enabled=シネマティックなレターボックスを有効/無効にします。
desc:Letterbox:Aspect Ratio=目標アスペクト比（画面より横長のときにバーが表示されます）。
desc:Letterbox:Opacity=バーの不透明度（0 = 透明、1 = 不透明）。
desc:Letterbox:Bar Red=バーの色の赤成分。
desc:Letterbox:Bar Green=バーの色の緑成分。
desc:Letterbox:Bar Blue=バーの色の青成分。
desc:Letterbox:Debug View=バー領域を強調表示します。

desc:LUT:Enabled=カラーグレーディングを有効/無効にします。
desc:LUT:Tonemapper=HDRからLDRへのトーンマッピング演算子。
desc:LUT:Exposure=全体の露出調整（EV段数）。
desc:LUT:Auto Exposure=シーンの明るさに応じて露出を自動調整します。
desc:LUT:Adaptation Speed=自動露出が明るさの変化に適応する速さ。
desc:LUT:Min Auto EV=自動露出の最小露出値。
desc:LUT:Max Auto EV=自動露出の最大露出値。
desc:LUT:Intensity=カラーグレーディングLUTのブレンド係数（0 = バイパス）。
desc:LUT:Lift (Shadows)=暗い階調に適用する明るさのオフセット。
desc:LUT:Gamma (Midtones)=中間調のガンマカーブ調整。
desc:LUT:Gain (Highlights)=ハイライトの明るさ倍率。
desc:LUT:Contrast=全体のコントラスト調整。
desc:LUT:Saturation=彩度の倍率（0 = グレースケール）。
desc:LUT:Temperature=ホワイトバランスのシフト（負 = 寒色、正 = 暖色）。
desc:LUT:Tint=緑–マゼンタの色合いシフト。
desc:LUT:Shadow Red=シャドウ領域の赤の色味。
desc:LUT:Shadow Green=シャドウ領域の緑の色味。
desc:LUT:Shadow Blue=シャドウ領域の青の色味。
desc:LUT:Highlight Red=ハイライト領域の赤の色味。
desc:LUT:Highlight Green=ハイライト領域の緑の色味。
desc:LUT:Highlight Blue=ハイライト領域の青の色味。

desc:Outline:Enabled=アウトラインを有効/無効にします。
desc:Outline:Depth Threshold=アウトラインを描く最小の深度差。
desc:Outline:Normal Threshold=アウトラインを描く最小の法線差。
desc:Outline:Thickness=アウトラインの幅（ピクセル）。
desc:Outline:Strength=アウトラインの不透明度（0 = 非表示、1 = 完全に不透明）。
desc:Outline:Color R=アウトライン色の赤成分。
desc:Outline:Color G=アウトライン色の緑成分。
desc:Outline:Color B=アウトライン色の青成分。
desc:Outline:Max Depth=アウトラインを描く最大深度（遠くの物体をスキップ）。
desc:Outline:Debug View=生のエッジ検出結果を表示します。

desc:RTGI:Enabled=レイトレース グローバルイルミネーションを有効/無効にします。
desc:RTGI:GI Intensity=間接光バウンスの明るさ。
desc:RTGI:AO Intensity=アンビエントオクルージョンによる暗さの強さ。
desc:RTGI:Shadow Contrast=方向性GI遮蔽のコントラスト。1より大きいと隙間や物体の下が暗くなり、1.0で通常の線形AOになります。
desc:RTGI:Ray Length=GIの収集半径（スクリーンスペースのホライズンマーチ距離）。
desc:RTGI:Steps Per Slice=ホライズンスライスごとの深度サンプル数（多いほど高品質、コスト増）。
desc:RTGI:Slices=ピクセルごとのホライズンスライス方向数（多いほど低ノイズ、コスト増）。
desc:RTGI:Thickness=可視面の裏にある遮蔽物の想定厚み。
desc:RTGI:Thickness Curve=距離に応じた厚みのスケーリング方法。
desc:RTGI:Fade Distance=効果がフェードアウトする距離。
desc:RTGI:Normal Detail=法線マップの影響（0 = 滑らかなジオメトリ、1 = 完全なディテール）。
desc:RTGI:Bounce Intensity=二次光バウンスの強さ。
desc:RTGI:Saturation=間接光の色の彩度。
desc:RTGI:Denoise Steps=空間ノイズ除去パスの数。
desc:RTGI:Depth Sigma=ノイズ除去の深度感度。
desc:RTGI:Color Phi=ノイズ除去の色感度。
desc:RTGI:Resolution %=ネイティブ解像度に対する割合でレンダリングします（低いほど高速）。
desc:RTGI:Debug View=デバッグ表示モード（0 = オフ）。

desc:SMAA:Enabled=アンチエイリアスを有効/無効にします。
desc:SMAA:Mode=エッジ検出方式: 輝度、深度、または両方。
desc:SMAA:Luma Threshold=輝度ベースのエッジ検出感度（低いほど多くのエッジを検出）。
desc:SMAA:Depth Threshold=深度ベースのエッジ検出感度（低いほど多くのエッジを検出）。
desc:SMAA:Show Edges=検出したエッジを可視化します。
desc:SMAA:Show Weights=ブレンドウェイトを可視化します。

desc:SSAO:Enabled=アンビエントオクルージョンを有効/無効にします。
desc:SSAO:Radius=遮蔽テストのワールド空間サンプリング半径。
desc:SSAO:Strength=遮蔽による暗さの強さ。
desc:SSAO:Bias=自己遮蔽アーティファクトを防ぐバイアス。
desc:SSAO:Max Depth=遮蔽を適用する最大深度。
desc:SSAO:Filter Radius=AO結果を滑らかにするブラー半径。
desc:SSAO:Foreground Fade=非常に近い物体で効果がフェードアウトする速さ。
desc:SSAO:Falloff Power=サンプル距離に応じて遮蔽が減衰する速さ。
desc:SSAO:Max Screen Radius=スクリーンスペースの最大サンプリング半径。
desc:SSAO:Min Screen Radius=スクリーンスペースの最小サンプリング半径。
desc:SSAO:Blur Sharpness=エッジを考慮したブラーのシャープさ（高いほどディテールを保持）。
desc:SSAO:Normal Detail=法線マップの影響（0 = 滑らかなジオメトリ、1 = 完全なディテール）。
desc:SSAO:Direct Light AO=直接光の当たる領域にAOがどれだけ影響するか。
desc:SSAO:Samples=ピクセルごとのサンプリング方向数。
desc:SSAO:Steps=方向ごとのサンプル数。
desc:SSAO:Debug View=合成前の生のアンビエントオクルージョンを表示します。

desc:SSIL:Enabled=スクリーンスペース間接照明を有効/無効にします。
desc:SSIL:Radius=間接光のサンプリング半径。
desc:SSIL:Strength=間接光の寄与の強さ。
desc:SSIL:Bias=自己照明アーティファクトを防ぐバイアス。
desc:SSIL:Max Depth=効果を適用する最大深度。
desc:SSIL:Foreground Fade=非常に近い物体で効果がフェードアウトする速さ。
desc:SSIL:Falloff Power=距離に応じて光の寄与が減衰する速さ。
desc:SSIL:Max Screen Radius=スクリーンスペースの最大サンプリング半径。
desc:SSIL:Min Screen Radius=スクリーンスペースの最小サンプリング半径。
desc:SSIL:Color Bleeding=近くの面の色が隣接する面へどれだけ移るか。
desc:SSIL:Directions=ピクセルごとのサンプリング方向数。
desc:SSIL:Steps=方向ごとのサンプル数。
desc:SSIL:Blur Sharpness=エッジを考慮したブラーのシャープさ（高いほどディテールを保持）。
desc:SSIL:Debug View=合成前の生の間接光を表示します。

desc:Vignette:Enabled=ビネット効果を有効/無効にします。
desc:Vignette:Intensity=ビネットの強さ。
desc:Vignette:Radius=ビネットの半径。
desc:Vignette:Softness=ビネットの縁の柔らかさ。
desc:Vignette:Roundness=ビネット形状の丸み。
desc:Vignette:Center X=ビネット中心のX座標。
desc:Vignette:Center Y=ビネット中心のY座標。
desc:Vignette:Debug View=ビネットのデバッグ表示を表示します。
desc:Vignette:Shape=ビネットの形状スタイル。
Softness=柔らかさ
Roundness=丸み
