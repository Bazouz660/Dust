desc:Shadows:Enabled=Ativa ou desativa a filtragem de sombras aprimorada do Dust (RTWSM e CSM). Desativado, o Kenshi usa sua filtragem original.
desc:Shadows:Shadow Resolution=Substitui a resolução do atlas de sombras. Vanilla = sem substituição (custo zero). Valores maiores dão sombras mais nítidas, mas o tempo de GPU e a VRAM da renderização de sombras crescem proporcionalmente (16384 ≈ 1 GB); acima de 8192 a taxa de quadros pode cair bastante. Aplica-se no próximo quadro.
desc:Shadows:Shadow Range=Distância máxima de renderização das sombras. Contorna o limite de 9000 do menu de opções do jogo. Aplicado ao vivo (as divisões das cascatas e a câmera de sombras são recalculadas no próximo quadro) e gravado no settings.cfg para sobreviver ao reinício. Mover o controle de distância das sombras no jogo sobrescreve este valor.
desc:Shadows:Filter Radius=Raio do filtro de suavização das sombras (apenas RTWSM).
desc:Shadows:Light Size=Tamanho de luz simulado para sombras com endurecimento por contato (PCSS do RTWSM).
desc:Shadows:PCSS=Ativa as sombras suaves PCSS (Percentage-Closer Soft Shadows) para o RTWSM (suavidade baseada na distância).
desc:Shadows:Cliff Shadow Fix=Reduz a acne de sombras em penhascos íngremes e superfícies verticais (apenas RTWSM). Pode atenuar sombras verticais próximas. Integrado do mod Cliff Face Shadow Fix de Crunk Aint Dead.
desc:Shadows:Cliff Fix Distance=Faixa em que a correção de penhascos entra gradualmente, como fração do alcance das sombras; maior = mais sombras verticais próximas preservadas.
desc:Shadows:Cascade Lambda=Distribuição das divisões das cascatas PSSM. 0,95 (padrão) mantém as divisões nativas do Kenshi; qualquer outro valor as substitui: 0,0 = puramente linear (sombras próximas cobrem mais longe, mas ficam mais quadriculadas), 1,0 = puramente logarítmico (sombras próximas pequenas e nítidas, cascatas distantes maiores).
desc:Shadows:CSM Filter Radius=Multiplicador global do raio do filtro PCF das CSM, aplicado sobre o raio por cascata original do Kenshi.
desc:Shadows:Cascade Blending=Mescla suavemente as cascatas CSM vizinhas perto dos limites de divisão para esconder o salto brusco de resolução nas fronteiras.
desc:Shadows:Cascade Blend Width=Largura da zona de mesclagem em cada limite de cascata, como fração da profundidade da cascata (0,05 = sutil, 0,25 = ampla).
desc:Shadows:CSM Far Softness=Controla apenas a suavidade da cascata mais distante, sem afetar as cascatas próximas/médias. Menor = mais nítido, maior = mais suave.

