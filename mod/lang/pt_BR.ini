desc:Bloom:Enabled=Ativa ou desativa o efeito bloom.
desc:Bloom:Intensity=Multiplicador global do brilho do bloom.
desc:Bloom:Threshold=Brilho mínimo para um pixel contribuir com o bloom.
desc:Bloom:Soft Knee=Suavidade do corte do limiar (0 = limiar rígido, 1 = limiar suave).
desc:Bloom:Radius=Tamanho do kernel de desfoque do bloom.
desc:Bloom:Curve=Controla a curva de atenuação do bloom ao redor das áreas claras.
desc:Bloom:Scatter=Quanto o bloom se espalha entre os níveis de mip (maior = brilho mais amplo).
desc:Bloom:Glow Amount=Dispersão extra dos mips mais profundos para um brilho mais visível ao redor de objetos claros.
desc:Bloom:Mip Levels=Número de passes de desfoque (mais = bloom mais amplo, mais caro).
desc:Bloom:Debug View=Mostra a contribuição bruta do bloom antes da composição.

desc:Clarity:Enabled=Ativa ou desativa o efeito de clareza.
desc:Clarity:Strength=Força do realce de contraste local.
desc:Clarity:Midtone Protect=Protege os meios-tons de nitidez excessiva (0 = sem proteção).
desc:Clarity:Blur Radius=Raio de desfoque para a extração de detalhes.
desc:Clarity:Debug View=Mostra a camada de detalhes extraída.

desc:Chromatic Aberration:Enabled=Ativa ou desativa a aberração cromática.
desc:Chromatic Aberration:Strength=Força das franjas RGB nas bordas da tela.
desc:Chromatic Aberration:Debug View=Mostra a magnitude do deslocamento como mapa de calor.

desc:Deband:Enabled=Ativa ou desativa o deband.
desc:Deband:Threshold=Diferença de cor máxima considerada banding.
desc:Deband:Range=Raio de busca em pixels para a amostragem média.
desc:Deband:Intensity=Força da mistura do resultado do deband.
desc:Deband:Sky Only=Aplica o deband apenas aos pixels do céu.
desc:Deband:Sky Threshold=Pixels além deste valor de profundidade são considerados céu.
desc:Deband:Debug View=Destaca as áreas afetadas pelo deband.

desc:Depth of Field:Enabled=Ativa ou desativa a profundidade de campo.
desc:Depth of Field:Auto Focus=Foca automaticamente no objeto do centro da tela.
desc:Depth of Field:Focus Speed=Velocidade com que o foco automático se adapta a um novo alvo.
desc:Depth of Field:Focus Distance=Distância de foco manual (usada com o foco automático desativado).
desc:Depth of Field:Near Start=Distância à frente do ponto de foco onde o desfoque próximo começa.
desc:Depth of Field:Near End=Distância à frente do ponto de foco onde o desfoque próximo atinge o máximo.
desc:Depth of Field:Near Strength=Força máxima do desfoque próximo (0 = sem desfoque próximo).
desc:Depth of Field:Far Start=Distância atrás do ponto de foco onde o desfoque distante começa.
desc:Depth of Field:Far End=Distância atrás do ponto de foco onde o desfoque distante atinge o máximo.
desc:Depth of Field:Far Strength=Força máxima do desfoque distante (0 = sem desfoque distante).
desc:Depth of Field:Blur Radius=Tamanho do kernel de desfoque em pixels.
desc:Depth of Field:Blur Downscale=Divisor de resolução do passe de desfoque (2 = meia resolução, 4 = um quarto).
desc:Depth of Field:Blur Shape=Forma do kernel de desfoque nas áreas fora de foco.
desc:Depth of Field:Max Depth=Profundidade máxima processada (ignora objetos distantes e o céu).
desc:Depth of Field:Physical DoF=Usa um modelo de abertura de lente fina em vez de rampas manuais de desfoque próximo/distante.
desc:Depth of Field:Aperture=Tamanho da abertura da lente para a profundidade de campo física (menor = mais profundidade em foco).
desc:Depth of Field:Highlight Threshold=Realces acima deste brilho atravessam o desfoque.
desc:Depth of Field:Highlight Boost=Força com que os realces atravessam as áreas desfocadas.
desc:Depth of Field:Debug View=Visualiza o círculo de confusão como sobreposição colorida.

desc:Film Grain:Enabled=Ativa ou desativa a granulação de filme.
desc:Film Grain:Intensity=Força do ruído de granulação.
desc:Film Grain:Size=Tamanho do grão em pixels.
desc:Film Grain:Colored=Usa ruído colorido em vez de ruído apenas de luminância.
desc:Film Grain:Debug View=Mostra o padrão de ruído bruto.

desc:Kuwahara:Enabled=Ativa ou desativa o filtro pictórico Kuwahara.
desc:Kuwahara:Radius=Raio do kernel do filtro (maior = estilização mais forte).
desc:Kuwahara:Strength=Proporção de mistura entre a imagem original e a filtrada.
desc:Kuwahara:Sharpness=Nitidez da preservação de bordas (maior = limites mais definidos).
desc:Kuwahara:Debug View=Mostra o resultado filtrado sem misturar com o original.

desc:Letterbox:Enabled=Ativa ou desativa as barras pretas cinematográficas.
desc:Letterbox:Aspect Ratio=Proporção alvo (as barras aparecem quando é mais larga que a tela).
desc:Letterbox:Opacity=Opacidade das barras (0 = transparentes, 1 = sólidas).
desc:Letterbox:Bar Red=Componente vermelho da cor das barras.
desc:Letterbox:Bar Green=Componente verde da cor das barras.
desc:Letterbox:Bar Blue=Componente azul da cor das barras.
desc:Letterbox:Debug View=Destaca a área das barras.

desc:LUT:Enabled=Ativa ou desativa a gradação de cores.
desc:LUT:Tonemapper=Operador de mapeamento tonal de HDR para LDR.
desc:LUT:Exposure=Ajuste global de exposição, em passos de EV.
desc:LUT:Auto Exposure=Ajusta automaticamente a exposição conforme o brilho da cena.
desc:LUT:Adaptation Speed=Velocidade com que a exposição automática se adapta às mudanças de brilho.
desc:LUT:Min Auto EV=Valor de exposição mínimo para a exposição automática.
desc:LUT:Max Auto EV=Valor de exposição máximo para a exposição automática.
desc:LUT:Intensity=Fator de mistura da LUT de gradação (0 = ignorada).
desc:LUT:Lift (Shadows)=Deslocamento de brilho aplicado aos tons escuros.
desc:LUT:Gamma (Midtones)=Ajuste da curva gama dos meios-tons.
desc:LUT:Gain (Highlights)=Multiplicador de brilho dos realces.
desc:LUT:Contrast=Ajuste global de contraste.
desc:LUT:Saturation=Multiplicador de saturação de cor (0 = tons de cinza).
desc:LUT:Temperature=Deslocamento do balanço de branco (negativo = mais frio, positivo = mais quente).
desc:LUT:Tint=Deslocamento de matiz verde-magenta.
desc:LUT:Shadow Red=Matiz vermelho das áreas de sombra.
desc:LUT:Shadow Green=Matiz verde das áreas de sombra.
desc:LUT:Shadow Blue=Matiz azul das áreas de sombra.
desc:LUT:Highlight Red=Matiz vermelho dos realces.
desc:LUT:Highlight Green=Matiz verde dos realces.
desc:LUT:Highlight Blue=Matiz azul dos realces.

desc:Outline:Enabled=Ativa ou desativa o contorno.
desc:Outline:Depth Threshold=Diferença mínima de profundidade para desenhar um contorno.
desc:Outline:Normal Threshold=Diferença mínima de normais para desenhar um contorno.
desc:Outline:Thickness=Espessura do contorno em pixels.
desc:Outline:Strength=Opacidade do contorno (0 = invisível, 1 = totalmente opaco).
desc:Outline:Color R=Componente vermelho da cor do contorno.
desc:Outline:Color G=Componente verde da cor do contorno.
desc:Outline:Color B=Componente azul da cor do contorno.
desc:Outline:Max Depth=Profundidade máxima para desenhar contornos (ignora objetos distantes).
desc:Outline:Debug View=Mostra o resultado bruto da detecção de bordas.

desc:RTGI:Enabled=Ativa ou desativa a iluminação global por ray tracing.
desc:RTGI:GI Intensity=Brilho do rebote de luz indireta.
desc:RTGI:AO Intensity=Força do escurecimento por oclusão de ambiente.
desc:RTGI:Shadow Contrast=Contraste da oclusão GI direcional. Acima de 1 escurece frestas e a parte de baixo dos objetos; 1,0 = AO linear normal.
desc:RTGI:Ray Length=Raio de coleta da GI (distância de marcha de horizonte em espaço de tela).
desc:RTGI:Steps Per Slice=Amostras de profundidade por fatia de horizonte (mais = melhor qualidade, mais caro).
desc:RTGI:Slices=Número de direções de fatia de horizonte por pixel (mais = menos ruído, mais caro).
desc:RTGI:Thickness=Espessura presumida dos oclusores atrás das superfícies visíveis.
desc:RTGI:Thickness Curve=Como a espessura escala com a distância.
desc:RTGI:Fade Distance=Distância em que o efeito esmaece.
desc:RTGI:Normal Detail=Influência do mapa de normais (0 = geometria lisa, 1 = detalhe completo).
desc:RTGI:Bounce Intensity=Força do rebote de luz secundário.
desc:RTGI:Saturation=Saturação de cor da luz indireta.
desc:RTGI:Denoise Steps=Número de passes de redução de ruído espacial.
desc:RTGI:Depth Sigma=Sensibilidade à profundidade do redutor de ruído.
desc:RTGI:Color Phi=Sensibilidade à cor do redutor de ruído.
desc:RTGI:Resolution %=Renderiza em uma porcentagem da resolução nativa (menor = mais rápido).
desc:RTGI:Debug View=Modo de visualização de depuração (0 = desligado).

desc:SMAA:Enabled=Ativa ou desativa o anti-aliasing.
desc:SMAA:Mode=Método de detecção de bordas: luminância, profundidade ou ambos.
desc:SMAA:Luma Threshold=Sensibilidade da detecção de bordas por luminância (menor = mais bordas detectadas).
desc:SMAA:Depth Threshold=Sensibilidade da detecção de bordas por profundidade (menor = mais bordas detectadas).
desc:SMAA:Show Edges=Visualiza as bordas detectadas.
desc:SMAA:Show Weights=Visualiza os pesos de mistura.

desc:SSAO:Enabled=Ativa ou desativa a oclusão de ambiente.
desc:SSAO:Radius=Raio de amostragem em espaço de mundo para o teste de oclusão.
desc:SSAO:Strength=Força do escurecimento por oclusão.
desc:SSAO:Bias=Viés para evitar artefatos de auto-oclusão.
desc:SSAO:Max Depth=Profundidade máxima em que a oclusão é aplicada.
desc:SSAO:Filter Radius=Raio de desfoque para suavizar o resultado da AO.
desc:SSAO:Foreground Fade=Velocidade com que o efeito esmaece em objetos muito próximos.
desc:SSAO:Falloff Power=Velocidade com que a oclusão decai com a distância de amostragem.
desc:SSAO:Max Screen Radius=Raio de amostragem máximo em espaço de tela.
desc:SSAO:Min Screen Radius=Raio de amostragem mínimo em espaço de tela.
desc:SSAO:Blur Sharpness=Nitidez do desfoque sensível a bordas (maior = mais detalhes preservados).
desc:SSAO:Normal Detail=Influência do mapa de normais (0 = geometria lisa, 1 = detalhe completo).
desc:SSAO:Direct Light AO=Quanto a AO afeta as áreas com luz direta.
desc:SSAO:Samples=Número de direções de amostragem por pixel.
desc:SSAO:Steps=Número de amostras por direção.
desc:SSAO:Debug View=Mostra a oclusão de ambiente bruta antes da composição.

desc:SSIL:Enabled=Ativa ou desativa a iluminação indireta em espaço de tela.
desc:SSIL:Radius=Raio de amostragem da luz indireta.
desc:SSIL:Strength=Força da contribuição de luz indireta.
desc:SSIL:Bias=Viés para evitar artefatos de autoiluminação.
desc:SSIL:Max Depth=Profundidade máxima em que o efeito é aplicado.
desc:SSIL:Foreground Fade=Velocidade com que o efeito esmaece em objetos muito próximos.
desc:SSIL:Falloff Power=Velocidade com que a contribuição de luz decai com a distância.
desc:SSIL:Max Screen Radius=Raio de amostragem máximo em espaço de tela.
desc:SSIL:Min Screen Radius=Raio de amostragem mínimo em espaço de tela.
desc:SSIL:Color Bleeding=Quanto a cor das superfícies próximas se transfere para as superfícies adjacentes.
desc:SSIL:Directions=Número de direções de amostragem por pixel.
desc:SSIL:Steps=Número de amostras por direção.
desc:SSIL:Blur Sharpness=Nitidez do desfoque sensível a bordas (maior = mais detalhes preservados).
desc:SSIL:Debug View=Mostra a luz indireta bruta antes da composição.

