Click to rebind the overlay toggle key=Clique para reatribuir a tecla que abre o menu
tip:Toggle Effects hotkey=Clique para reatribuir o atalho que ativa/desativa todos os efeitos. Funciona com o menu aberto ou fechado. Para remover o atalho, defina ToggleEffectsKey=0 no Dust.ini.
tip:Show Motion Vectors=Sobreposição de depuração do buffer de vetores de movimento: cinza = parado, cor = direção/magnitude do movimento, vermelho = sem vetor. Observe a grama e a vegetação enquanto se move; se ficarem cinzas ao balançar, não têm vetor válido e vão deixar rastros com o DLAA.
tip:Upscaling=Anti-aliasing temporal / upscaling. DLAA = apenas NVIDIA RTX (melhor qualidade). FSR2 = qualquer GPU (D3D11 nativo). FSR3 / FSR4 = qualquer GPU DX12 por meio de um dispositivo D3D12 secundário; o FSR4 exige uma Radeon RX 9000. Desativado = desligado.
DLAA unavailable (needs NVIDIA RTX + recent driver)=DLAA indisponível (requer NVIDIA RTX e um driver recente)
tip:DLAA model=Modelo do DLAA. F = CNN (recomendado). K/J são o transformer do DLSS 4: os mais nítidos em teoria, mas nesta integração borram toda a imagem quando a cena está parada. Alterar reconstrói o recurso no próximo quadro.
Sharpness=Nitidez
tip:Sharpness=Nitidez com contraste limitado (RCAS) na saída ampliada: adiciona detalhes sem o reforço de contraste/halo do Clareza. Valores altos podem reintroduzir serrilhado.
Show Motion Vectors=Mostrar vetores de movimento
Restart the game to enable motion vectors=Reinicie o jogo para ativar os vetores de movimento
tip:Restart for motion vectors=A saída de vetores de movimento é compilada nos shaders do jogo quando o Kenshi inicia. Esta sessão começou com o upscaling desativado, então os shaders não têm saída de velocidade: objetos em movimento vão deixar rastros até você reiniciar o jogo. A configuração está salva; a próxima inicialização compilará os shaders com vetores de movimento.
Motion Vectors=Vetores de movimento
UI theme. Kenshi: desaturated grey-tan palette matching the game. Dark: ImGui default.=Tema da interface. Kenshi: paleta cinza-bege dessaturada combinando com o jogo. Escuro: padrão do ImGui.
