desc:Shadows:Enabled=Active ou désactive le filtrage d'ombres amélioré de Dust (RTWSM et CSM). Désactivé, Kenshi utilise son filtrage d'origine.
desc:Shadows:Shadow Resolution=Remplace la résolution de l'atlas d'ombres. Vanilla = pas de remplacement (aucun coût). Plus la valeur est élevée, plus les ombres sont nettes, mais le temps GPU et la VRAM du rendu des ombres augmentent en proportion (16384 ≈ 1 Go) ; au-delà de 8192, la fréquence d'images peut nettement baisser. Prend effet à l'image suivante.
desc:Shadows:Shadow Range=Distance maximale de rendu des ombres. Contourne la limite de 9000 du menu d'options du jeu. Appliqué en direct (les découpes de cascades et la caméra d'ombre sont recalculées à l'image suivante) et écrit dans settings.cfg pour survivre au redémarrage. Bouger le curseur de distance des ombres dans le jeu écrase cette valeur.
desc:Shadows:Filter Radius=Rayon du filtre d'adoucissement des ombres (RTWSM uniquement).
desc:Shadows:Light Size=Taille de lumière simulée pour les ombres à durcissement par contact (PCSS RTWSM).
desc:Shadows:PCSS=Active les ombres douces PCSS (Percentage-Closer Soft Shadows) pour RTWSM (douceur selon la distance).
desc:Shadows:Cliff Shadow Fix=Réduit l'acné d'ombre sur les falaises abruptes et les surfaces verticales (RTWSM uniquement). Peut estomper les ombres verticales proches. Intégré depuis le mod Cliff Face Shadow Fix de Crunk Aint Dead.
desc:Shadows:Cliff Fix Distance=Portée sur laquelle la correction des falaises s'applique progressivement, en fraction de la portée des ombres ; plus élevé = plus d'ombres verticales proches conservées.
desc:Shadows:Cascade Lambda=Répartition des découpes de cascades PSSM. 0,95 (défaut) conserve les découpes natives de Kenshi ; toute autre valeur les remplace : 0,0 = purement linéaire (les ombres proches couvrent plus loin mais sont plus pixelisées), 1,0 = purement logarithmique (ombres proches petites et nettes, cascades lointaines plus grandes).
desc:Shadows:CSM Filter Radius=Multiplicateur global du rayon de filtre PCF des CSM, appliqué par-dessus le rayon par cascade d'origine de Kenshi.
desc:Shadows:Cascade Blending=Fond en douceur les cascades CSM voisines près de leurs limites de découpe, pour masquer le saut de résolution visible aux frontières.
desc:Shadows:Cascade Blend Width=Largeur de la zone de fondu à chaque limite de cascade, en fraction de la profondeur de la cascade (0,05 = subtil, 0,25 = large).
desc:Shadows:CSM Far Softness=Contrôle uniquement la douceur de la cascade la plus lointaine, sans toucher aux cascades proches/moyennes. Plus bas = plus net, plus haut = plus doux.

