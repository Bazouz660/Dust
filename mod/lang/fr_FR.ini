desc:Bloom:Enabled=Active ou désactive l'effet de bloom.
desc:Bloom:Intensity=Multiplicateur global de luminosité du bloom.
desc:Bloom:Threshold=Luminosité minimale pour qu'un pixel contribue au bloom.
desc:Bloom:Soft Knee=Douceur de la coupure du seuil (0 = seuil dur, 1 = seuil doux).
desc:Bloom:Radius=Taille du noyau de flou du bloom.
desc:Bloom:Curve=Contrôle la courbe d'atténuation du bloom autour des zones lumineuses.
desc:Bloom:Scatter=Distance de dispersion du bloom entre les niveaux de mip (plus haut = halo plus large).
desc:Bloom:Glow Amount=Dispersion supplémentaire des mips profonds, pour un halo plus visible autour des objets lumineux.
desc:Bloom:Mip Levels=Nombre de passes de flou (plus = bloom plus large, plus coûteux).
desc:Bloom:Debug View=Affiche la contribution brute du bloom avant composition.

desc:Clarity:Enabled=Active ou désactive l'effet de clarté.
desc:Clarity:Strength=Force du renforcement du contraste local.
desc:Clarity:Midtone Protect=Protège les tons moyens d'une accentuation excessive (0 = aucune protection).
desc:Clarity:Blur Radius=Rayon de flou pour l'extraction des détails.
desc:Clarity:Debug View=Affiche la couche de détails extraite.

desc:Chromatic Aberration:Enabled=Active ou désactive l'aberration chromatique.
desc:Chromatic Aberration:Strength=Force des franges RVB sur les bords de l'écran.
desc:Chromatic Aberration:Debug View=Affiche l'amplitude du décalage sous forme de carte de chaleur.

desc:Deband:Enabled=Active ou désactive l'anti-banding.
desc:Deband:Threshold=Différence de couleur maximale considérée comme du banding.
desc:Deband:Range=Rayon de recherche en pixels pour l'échantillonnage moyen.
desc:Deband:Intensity=Force du mélange du résultat anti-banding.
desc:Deband:Sky Only=N'applique l'anti-banding qu'aux pixels du ciel.
desc:Deband:Sky Threshold=Les pixels au-delà de cette profondeur sont considérés comme du ciel.
desc:Deband:Debug View=Met en évidence les zones affectées par l'anti-banding.

desc:Depth of Field:Enabled=Active ou désactive la profondeur de champ.
desc:Depth of Field:Auto Focus=Fait automatiquement la mise au point sur l'objet au centre de l'écran.
desc:Depth of Field:Focus Speed=Vitesse à laquelle la mise au point auto s'adapte à une nouvelle cible.
desc:Depth of Field:Focus Distance=Distance de mise au point manuelle (utilisée quand la mise au point auto est désactivée).
desc:Depth of Field:Near Start=Distance devant le point de mise au point où le flou proche commence.
desc:Depth of Field:Near End=Distance devant le point de mise au point où le flou proche atteint son maximum.
desc:Depth of Field:Near Strength=Force maximale du flou proche (0 = pas de flou proche).
desc:Depth of Field:Far Start=Distance derrière le point de mise au point où le flou lointain commence.
desc:Depth of Field:Far End=Distance derrière le point de mise au point où le flou lointain atteint son maximum.
desc:Depth of Field:Far Strength=Force maximale du flou lointain (0 = pas de flou lointain).
desc:Depth of Field:Blur Radius=Taille du noyau de flou en pixels.
desc:Depth of Field:Blur Downscale=Diviseur de résolution de la passe de flou (2 = demi-résolution, 4 = quart).
desc:Depth of Field:Blur Shape=Forme du noyau de flou dans les zones hors focus.
desc:Depth of Field:Max Depth=Profondeur maximale traitée (ignore les objets lointains et le ciel).
desc:Depth of Field:Physical DoF=Utilise un modèle d'ouverture à lentille mince au lieu des rampes de flou proche/lointain manuelles.
desc:Depth of Field:Aperture=Taille de l'ouverture de l'objectif pour la profondeur de champ physique (plus petit = plus de profondeur nette).
desc:Depth of Field:Highlight Threshold=Les hautes lumières au-dessus de cette luminosité traversent le flou.
desc:Depth of Field:Highlight Boost=Force avec laquelle les hautes lumières traversent les zones floues.
desc:Depth of Field:Debug View=Visualise le cercle de confusion en superposition colorée.

desc:Film Grain:Enabled=Active ou désactive le grain de film.
desc:Film Grain:Intensity=Force du bruit de grain.
desc:Film Grain:Size=Taille du grain en pixels.
desc:Film Grain:Colored=Utilise un bruit coloré au lieu d'un bruit de luminance seule.
desc:Film Grain:Debug View=Affiche le motif de bruit brut.

desc:Kuwahara:Enabled=Active ou désactive le filtre peinture Kuwahara.
desc:Kuwahara:Radius=Rayon du noyau de filtre (plus grand = stylisation plus marquée).
desc:Kuwahara:Strength=Proportion de mélange entre l'image d'origine et l'image filtrée.
desc:Kuwahara:Sharpness=Netteté de la préservation des bords (plus haut = contours plus nets).
desc:Kuwahara:Debug View=Affiche le résultat filtré sans le mélanger à l'original.

desc:Letterbox:Enabled=Active ou désactive les bandes noires cinéma.
desc:Letterbox:Aspect Ratio=Format d'image cible (des bandes apparaissent quand il est plus large que l'écran).
desc:Letterbox:Opacity=Opacité des bandes (0 = transparentes, 1 = pleines).
desc:Letterbox:Bar Red=Composante rouge de la couleur des bandes.
desc:Letterbox:Bar Green=Composante verte de la couleur des bandes.
desc:Letterbox:Bar Blue=Composante bleue de la couleur des bandes.
desc:Letterbox:Debug View=Met en évidence la zone des bandes.

desc:LUT:Enabled=Active ou désactive l'étalonnage des couleurs.
desc:LUT:Tonemapper=Opérateur de tone mapping HDR vers LDR.
desc:LUT:Exposure=Réglage global de l'exposition, en EV.
desc:LUT:Auto Exposure=Ajuste automatiquement l'exposition selon la luminosité de la scène.
desc:LUT:Adaptation Speed=Vitesse d'adaptation de l'exposition auto aux changements de luminosité.
desc:LUT:Min Auto EV=Valeur d'exposition minimale pour l'exposition auto.
desc:LUT:Max Auto EV=Valeur d'exposition maximale pour l'exposition auto.
desc:LUT:Intensity=Facteur de mélange de la LUT d'étalonnage (0 = contournée).
desc:LUT:Lift (Shadows)=Décalage de luminosité appliqué aux tons sombres.
desc:LUT:Gamma (Midtones)=Ajustement de la courbe gamma des tons moyens.
desc:LUT:Gain (Highlights)=Multiplicateur de luminosité des hautes lumières.
desc:LUT:Contrast=Réglage global du contraste.
desc:LUT:Saturation=Multiplicateur de saturation des couleurs (0 = niveaux de gris).
desc:LUT:Temperature=Décalage de balance des blancs (négatif = plus froid, positif = plus chaud).
desc:LUT:Tint=Décalage de teinte vert-magenta.
desc:LUT:Shadow Red=Teinte rouge des zones d'ombre.
desc:LUT:Shadow Green=Teinte verte des zones d'ombre.
desc:LUT:Shadow Blue=Teinte bleue des zones d'ombre.
desc:LUT:Highlight Red=Teinte rouge des hautes lumières.
desc:LUT:Highlight Green=Teinte verte des hautes lumières.
desc:LUT:Highlight Blue=Teinte bleue des hautes lumières.

desc:Outline:Enabled=Active ou désactive les contours.
desc:Outline:Depth Threshold=Différence de profondeur minimale pour tracer un contour.
desc:Outline:Normal Threshold=Différence de normale minimale pour tracer un contour.
desc:Outline:Thickness=Épaisseur du contour en pixels.
desc:Outline:Strength=Opacité du contour (0 = invisible, 1 = totalement opaque).
desc:Outline:Color R=Composante rouge de la couleur du contour.
desc:Outline:Color G=Composante verte de la couleur du contour.
desc:Outline:Color B=Composante bleue de la couleur du contour.
desc:Outline:Max Depth=Profondeur maximale de tracé des contours (ignore les objets lointains).
desc:Outline:Debug View=Affiche le résultat brut de la détection de bords.

desc:RTGI:Enabled=Active ou désactive l'illumination globale par lancer de rayons.
desc:RTGI:GI Intensity=Luminosité du rebond de lumière indirecte.
desc:RTGI:AO Intensity=Force de l'assombrissement par occlusion ambiante.
desc:RTGI:Shadow Contrast=Contraste de l'occlusion GI directionnelle. Au-dessus de 1, les creux et le dessous des objets s'assombrissent ; 1,0 = AO linéaire normale.
desc:RTGI:Ray Length=Rayon de collecte de la GI (distance de marche d'horizon en espace écran).
desc:RTGI:Steps Per Slice=Échantillons de profondeur par tranche d'horizon (plus = meilleure qualité, plus coûteux).
desc:RTGI:Slices=Nombre de directions de tranches d'horizon par pixel (plus = moins de bruit, plus coûteux).
desc:RTGI:Thickness=Épaisseur supposée des occulteurs derrière les surfaces visibles.
desc:RTGI:Thickness Curve=Manière dont l'épaisseur varie avec la distance.
desc:RTGI:Fade Distance=Distance à laquelle l'effet s'estompe.
desc:RTGI:Normal Detail=Influence de la normal map (0 = géométrie lisse, 1 = détail complet).
desc:RTGI:Bounce Intensity=Force du rebond de lumière secondaire.
desc:RTGI:Saturation=Saturation des couleurs de la lumière indirecte.
desc:RTGI:Denoise Steps=Nombre de passes de débruitage spatial.
desc:RTGI:Depth Sigma=Sensibilité à la profondeur du débruiteur.
desc:RTGI:Color Phi=Sensibilité à la couleur du débruiteur.
desc:RTGI:Resolution %=Rendu en pourcentage de la résolution native (plus bas = plus rapide).
desc:RTGI:Debug View=Mode de visualisation de débogage (0 = désactivé).

desc:SMAA:Enabled=Active ou désactive l'anti-aliasing.
desc:SMAA:Mode=Méthode de détection des bords : luminance, profondeur ou les deux.
desc:SMAA:Luma Threshold=Sensibilité de la détection de bords par luminance (plus bas = plus de bords détectés).
desc:SMAA:Depth Threshold=Sensibilité de la détection de bords par profondeur (plus bas = plus de bords détectés).
desc:SMAA:Show Edges=Visualise les bords détectés.
desc:SMAA:Show Weights=Visualise les poids de mélange.

desc:SSAO:Enabled=Active ou désactive l'occlusion ambiante.
desc:SSAO:Radius=Rayon d'échantillonnage en espace monde pour le test d'occlusion.
desc:SSAO:Strength=Force de l'assombrissement par occlusion.
desc:SSAO:Bias=Biais pour éviter les artefacts d'auto-occlusion.
desc:SSAO:Max Depth=Profondeur maximale d'application de l'occlusion.
desc:SSAO:Filter Radius=Rayon de flou pour lisser le résultat AO.
desc:SSAO:Foreground Fade=Vitesse à laquelle l'effet s'estompe sur les objets très proches.
desc:SSAO:Falloff Power=Vitesse d'atténuation de l'occlusion avec la distance d'échantillonnage.
desc:SSAO:Max Screen Radius=Rayon d'échantillonnage maximal en espace écran.
desc:SSAO:Min Screen Radius=Rayon d'échantillonnage minimal en espace écran.
desc:SSAO:Blur Sharpness=Netteté du flou sensible aux bords (plus haut = plus de détails conservés).
desc:SSAO:Normal Detail=Influence de la normal map (0 = géométrie lisse, 1 = détail complet).
desc:SSAO:Direct Light AO=Degré d'influence de l'AO sur les zones en lumière directe.
desc:SSAO:Samples=Nombre de directions d'échantillonnage par pixel.
desc:SSAO:Steps=Nombre d'échantillons par direction.
desc:SSAO:Debug View=Affiche l'occlusion ambiante brute avant composition.

desc:SSIL:Enabled=Active ou désactive l'éclairage indirect en espace écran.
desc:SSIL:Radius=Rayon d'échantillonnage de la lumière indirecte.
desc:SSIL:Strength=Force de la contribution de la lumière indirecte.
desc:SSIL:Bias=Biais pour éviter les artefacts d'auto-illumination.
desc:SSIL:Max Depth=Profondeur maximale d'application de l'effet.
desc:SSIL:Foreground Fade=Vitesse à laquelle l'effet s'estompe sur les objets très proches.
desc:SSIL:Falloff Power=Vitesse d'atténuation de la contribution lumineuse avec la distance.
desc:SSIL:Max Screen Radius=Rayon d'échantillonnage maximal en espace écran.
desc:SSIL:Min Screen Radius=Rayon d'échantillonnage minimal en espace écran.
desc:SSIL:Color Bleeding=Degré de diffusion de la couleur des surfaces voisines sur les surfaces adjacentes.
desc:SSIL:Directions=Nombre de directions d'échantillonnage par pixel.
desc:SSIL:Steps=Nombre d'échantillons par direction.
desc:SSIL:Blur Sharpness=Netteté du flou sensible aux bords (plus haut = plus de détails conservés).
desc:SSIL:Debug View=Affiche la lumière indirecte brute avant composition.

desc:Vignette:Enabled=Active ou désactive le vignettage.
desc:Vignette:Intensity=Force du vignettage.
desc:Vignette:Radius=Rayon du vignettage.
desc:Vignette:Softness=Douceur du bord du vignettage.
desc:Vignette:Roundness=Rondeur de la forme du vignettage.
desc:Vignette:Center X=Coordonnée X du centre du vignettage.
desc:Vignette:Center Y=Coordonnée Y du centre du vignettage.
desc:Vignette:Debug View=Affiche la vue de débogage du vignettage.
desc:Vignette:Shape=Style de forme du vignettage.
