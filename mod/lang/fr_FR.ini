Write timestamped logs to the logs/ folder next to the DLL. Only the 10 newest sessions are kept (20 MB max each), so disk usage stays bounded. Needed for useful bug reports.=Écrit des journaux horodatés dans le dossier logs/ à côté de la DLL. Seules les 10 sessions les plus récentes sont conservées (20 Mo max chacune), l'espace disque reste donc borné. Nécessaire pour des rapports de bug utiles.
