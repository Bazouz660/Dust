tip:Toggle Effects hotkey=Cliquez pour réassigner le raccourci qui active/désactive tous les effets. Fonctionne que le menu soit ouvert ou non. Pour le désassigner, mettez ToggleEffectsKey=0 dans Dust.ini.
tip:Show Motion Vectors=Superposition de débogage du tampon de vecteurs de mouvement : gris = immobile, couleur = direction/amplitude du mouvement, rouge = pas de vecteur. Observez l'herbe et la végétation en vous déplaçant ; si elles restent grises en ondulant, elles n'ont pas de vecteur valide et produiront des images fantômes avec DLAA.
tip:Upscaling=Anti-aliasing temporel / mise à l'échelle. DLAA = NVIDIA RTX uniquement (meilleure qualité). FSR2 = tout GPU (D3D11 natif). FSR3 / FSR4 = tout GPU DX12 via un périphérique D3D12 secondaire ; FSR4 nécessite une Radeon RX 9000. Désactivé = off.
DLAA unavailable (needs NVIDIA RTX + recent driver)=DLAA indisponible (nécessite une NVIDIA RTX et un pilote récent)
tip:DLAA model=Modèle DLAA. F = CNN (recommandé). K/J sont le transformer DLSS 4 : les plus nets en théorie, mais ils floutent toute l'image quand la scène est statique dans cette intégration. Le changement reconstruit la fonctionnalité à l'image suivante.
Sharpness=Netteté
tip:Sharpness=Accentuation à contraste limité (RCAS) sur la sortie mise à l'échelle : ajoute du détail sans le gain de contraste/halo de Clarté. Des valeurs élevées peuvent réintroduire du crénelage.
Show Motion Vectors=Afficher les vecteurs de mouvement
Restart the game to enable motion vectors=Redémarrez le jeu pour activer les vecteurs de mouvement
tip:Restart for motion vectors=La sortie des vecteurs de mouvement est compilée dans les shaders du jeu au lancement de Kenshi. Cette session a démarré avec la mise à l'échelle désactivée : les shaders n'ont donc pas de sortie de vélocité et les objets en mouvement produiront des images fantômes jusqu'au redémarrage du jeu. Le réglage est enregistré ; le prochain lancement compilera les shaders avec les vecteurs de mouvement.
Motion Vectors=Vecteurs de mouvement
UI theme. Kenshi: desaturated grey-tan palette matching the game. Dark: ImGui default.=Thème de l'interface. Kenshi : palette gris-beige désaturée assortie au jeu. Sombre : thème ImGui par défaut.
